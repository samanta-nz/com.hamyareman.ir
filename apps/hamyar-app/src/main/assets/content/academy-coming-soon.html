<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>در دست تولید</title>
  <style>
    :root{color-scheme:dark;--ink:#f8fafc;--muted:#b7c4d7;--a:#5eead4;--b:#8b5cf6;--c:#38bdf8}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Vazirmatn,Vazir,Tahoma,sans-serif;background:#07111f;color:var(--ink)}
    body{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;isolation:isolate}
    body:before,body:after{content:"";position:fixed;width:52vw;height:52vw;border-radius:50%;filter:blur(70px);opacity:.28;z-index:-1;animation:float 8s ease-in-out infinite alternate}
    body:before{background:var(--b);right:-18vw;top:-15vw}body:after{background:var(--c);left:-20vw;bottom:-18vw;animation-delay:-3s}
    header,footer{display:flex;align-items:center;gap:10px;padding:14px 20px;background:rgba(7,17,31,.64);backdrop-filter:blur(18px);border-color:rgba(255,255,255,.1)}
    header{border-bottom:1px solid rgba(255,255,255,.1)}footer{justify-content:center;border-top:1px solid rgba(255,255,255,.1);color:var(--muted);font-size:12px}
    .mark{width:34px;height:34px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 0 28px rgba(94,234,212,.28)}
    header strong{font-size:15px}header span{display:block;color:var(--muted);font-size:11px;margin-top:1px}
    main{display:grid;place-items:center;padding:24px;position:relative}
    .card{width:min(100%,520px);padding:34px 24px;text-align:center;border:1px solid rgba(255,255,255,.15);border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));box-shadow:0 30px 80px rgba(0,0,0,.42);backdrop-filter:blur(22px);animation:enter .75s cubic-bezier(.2,.9,.2,1) both}
    .orb{width:104px;height:104px;margin:0 auto 24px;position:relative;display:grid;place-items:center;border-radius:34px;background:linear-gradient(135deg,rgba(94,234,212,.2),rgba(139,92,246,.3));border:1px solid rgba(255,255,255,.18)}
    .orb:before{content:"";position:absolute;inset:-10px;border-radius:42px;border:1px solid rgba(94,234,212,.32);animation:pulse 2.4s ease-out infinite}.orb span{font-size:48px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.32))}
    .eyebrow{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:rgba(94,234,212,.1);border:1px solid rgba(94,234,212,.22);color:var(--a);font-size:12px;font-weight:700}
    h1{font-size:clamp(27px,7vw,42px);line-height:1.35;margin:16px 0 10px;letter-spacing:-.7px}p{margin:0 auto;color:var(--muted);font-size:15px;line-height:2;max-width:34ch}
    .progress{height:7px;margin:26px auto 0;max-width:250px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.09)}.progress i{display:block;height:100%;width:44%;border-radius:inherit;background:linear-gradient(90deg,var(--a),var(--c),var(--b));animation:scan 2.2s ease-in-out infinite alternate}
    @keyframes enter{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}@keyframes pulse{0%{transform:scale(.86);opacity:.8}100%{transform:scale(1.2);opacity:0}}@keyframes scan{from{transform:translateX(125%)}to{transform:translateX(-125%)}}@keyframes float{to{transform:translateY(7vh) translateX(4vw) scale(1.1)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</head>
<body>
<header><div class="mark">✦</div><div><strong>همیار من</strong><span>آموزشگاه مهارت‌های کاربردی</span></div></header>
<main><section class="card"><div class="orb"><span>🚀</span></div><div class="eyebrow">در دست تولید</div><h1>یک تجربه‌ی تازه در راه است</h1><p>در دست تولید محتوا است و به‌زودی همین‌جا قرار می‌گیرد.</p><div class="progress"><i></i></div></section></main>
<footer>همیار من · یادگیری، آرام و پیوسته</footer>
</body>
</html>
