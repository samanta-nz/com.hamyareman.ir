function outgoing(element){const box=element.parentElement;box.querySelectorAll(':scope > .fade-ghost').forEach(n=>n.remove());if(matchMedia('(prefers-reduced-motion: reduce)').matches)return null;const ghost=element.cloneNode(true);const suffix='-fade-'+(++fadeSerial);let ids=new Map();[ghost,...ghost.querySelectorAll('[id]')].forEach(n=>{if(n.id){ids.set(n.id,n.id+suffix);n.id+=suffix}});[ghost,...ghost.querySelectorAll('*')].forEach(n=>{for(const a of [...n.attributes]){let v=a.value;ids.forEach((to,from)=>{v=v.replaceAll('url(#'+from+')','url(#'+to+')')});if(v!==a.value)n.setAttribute(a.name,v)}});ghost.classList.add('fade-ghost');ghost.setAttribute('aria-hidden','true');ghost.removeAttribute('role');box.append(ghost);return ghost}
function fadeAway(ghost){if(!ghost)return;const animation=ghost.animate([{opacity:1},{opacity:0}],{duration:450,easing:'ease-in-out',fill:'forwards'});animation.onfinish=()=>ghost.remove();animation.oncancel=()=>ghost.remove()}
// Preload each distinct embedded image once; no extra image bytes are embedded.
Object.values(CONFIG.frames).forEach(src=>{const image=new Image();image.src=src;image.decode?.().catch(()=>{})});
function render(){let t=Math.min(CONFIG.duration,audio.currentTime||0),idx=0;for(let i=0;i<CONFIG.events.length;i++){if(CONFIG.events[i].t<=t)idx=i;else break}let e=CONFIG.events[idx];
const changed=frame!==e.frame;const key=e.frame+'/'+(e.focus||'full');const focusChanged=key!==lastFocus;let mainGhost=changed&&frame?outgoing($('photo')):null;let insetGhost=focusChanged&&lastFocus?outgoing($('zoom')):null;
if(changed){frame=e.frame;$('photo').src=CONFIG.frames[frame];$('photo').alt=CONFIG.title+' — '+e.title+'؛ بدن و زیرانداز کامل';$('detailPhoto').setAttribute('href',CONFIG.frames[frame]);fadeAway(mainGhost)}
const p=CONFIG.focus[frame]?.[e.focus];$('focusInset').hidden=false;if(focusChanged){lastFocus=key;$('zoom').setAttribute('viewBox',p?p.box:'0 0 1120 751');$('zoom').setAttribute('aria-label',p?'نقطه توجه: '+p.title:'نمای کامل حرکت');$('focusTitle').textContent=p?p.title:'نمای کامل حرکت';for(let id of ['glow','outline']){let g=$(id);g.style.display=p?'':'none';if(p){g.setAttribute('cx',p.x);g.setAttribute('cy',p.y);g.setAttribute('rx',p.rx*(id==='glow'?1:.5));g.setAttribute('ry',p.ry*(id==='glow'?1:.5))}}fadeAway(insetGhost)}
let active=CONFIG.active.find(a=>t>=a[0]&&t<a[1]),end=active?active[1]:e.end,begin=active?active[0]:e.t,remaining=Math.max(0,end-t);$('time').textContent=clock(Math.ceil(remaining));$('timerLabel').textContent=active?'زمان نوبت':'زمان مرحله';$('ring').style.strokeDashoffset=Math.max(0,Math.min(100,(t-begin)/Math.max(.01,end-begin)*100));$('elapsed').textContent=clock(t);$('seek').value=t;
$('stage').textContent=ended?'بریم برای حرکت بعدی':started?fa(e.title):'آمادهٔ شروع';$('caption').textContent=ended?'برای ادامه، حرکت بعدی را لمس کن.':started?e.caption:'برای شروع، دکمهٔ شروع تمرین را لمس کن.';$('badge').textContent=fa(e.title);$('play').textContent=!audio.paused?'Ⅱ مکث':ended?'▷ دوباره انجام بدیم':started?'▷ ادامهٔ تمرین':'▷ شروع تمرین';lastEvent=idx;}
async function play(){if(ended){audio.currentTime=0;ended=false}started=true;$('message').hidden=true;try{await audio.play()}catch(e){$('message').hidden=false;$('message').textContent='پخش شروع نشد؛ دوباره لمس کن.'}render()}
$('play').onclick=()=>audio.paused?play():(audio.pause(),render());$('repeat').onclick=()=>{audio.pause();audio.currentTime=0;started=false;ended=false;render()};$('stop').onclick=()=>{audio.pause();background.pause();render()};function seek(t){audio.currentTime=Math.max(0,Math.min(CONFIG.duration,t));started=true;ended=false;render()}$('seek').oninput=e=>seek(Number(e.target.value));audio.onended=()=>{ended=true;render()};audio.ontimeupdate=render;audio.onpause=render;audio.onplay=render;audio.onerror=()=>{$('message').hidden=false;$('message').textContent='صدای مربی بارگذاری نشد.'};window.addEventListener('pagehide',()=>{audio.pause();background.pause()});document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['BUTTON','INPUT','A'].includes(document.activeElement.tagName)){e.preventDefault();$('play').click()}});function tick(){if(!audio.paused)render();requestAnimationFrame(tick)}render();requestAnimationFrame(tick);window.YogaPlayer={audio,background,play,seek,get state(){return{time:audio.currentTime,playing:!audio.paused,frame,focus:lastFocus,event:lastEvent,theme,ended,backgroundReady:ready}}};})();

</script><script id="hy-flow">(()=>{'use strict';
const P=window.YogaPlayer;if(!P||typeof CONFIG==='undefined')return;
const $=id=>document.getElementById(id),audio=P.audio,bg=P.background,nextBtn=$('next');

const fa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]),WAIT=15,TICK_FROM=5;
let navigating=false,counting=false,timer=0,deadline=0,lastTick=-1,tctx=null,prefetched=false;
function ringHTML(label){return '<i class="hy-wrap"><svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15.5" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="3"/><circle id="hyFg" cx="18" cy="18" r="15.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0" transform="rotate(-90 18 18)"/></svg><b id="hyNum" class="hy-num">'+fa(WAIT)+'</b></i><small>'+label+'</small>'}
function tick(final,vol){try{tctx=tctx||new(window.AudioContext||window.webkitAudioContext)();if(tctx.state==='suspended')tctx.resume();const t=tctx.currentTime,o=tctx.createOscillator(),g=tctx.createGain(),v=Math.max(.12,Math.min(.6,(vol||.85)*.6));o.type='sine';o.frequency.value=final?1320:880;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+.13);o.connect(g);g.connect(tctx.destination);o.start(t);o.stop(t+.15)}catch(e){}}
function prefetchNext(url){if(prefetched||!url||!/^https?:$/.test(location.protocol)||(navigator.connection&&navigator.connection.saveData))return;prefetched=true;fetch(new URL(url,location.href).href,{cache:'force-cache',headers:{'X-Hamyar-Prefetch':'1'}}).then(async r=>{if(!r.ok||!r.body)return;const rd=r.body.getReader();while(!(await rd.read()).done){}}).catch(()=>{prefetched=false})}

const ready=d=>!!CONFIG[d]&&!(CONFIG.navigationReady&&CONFIG.navigationReady[d]===false),hasNext=ready('next'),nextHTML=nextBtn.innerHTML,nextLabel=nextBtn.getAttribute('aria-label');
// Music keeps playing across lessons: only real stops/hides pause it, never our own navigation.
const rawPause=bg.pause.bind(bg);bg.pause=()=>{if(!navigating)rawPause()};
function say(t){const m=$('message');if(m){m.hidden=false;m.textContent=t}}
function loop(){if(!counting)return;const left=Math.max(0,(deadline-performance.now())/1000),sec=Math.ceil(left),fg=$('hyFg'),num=$('hyNum');if(fg)fg.style.strokeDashoffset=String(100*(1-left/WAIT));if(num)num.textContent=fa(sec);if(sec>0&&sec<=TICK_FROM&&sec!==lastTick){lastTick=sec;tick(false,audio.volume)}if(left<=0){finish();return}timer=setTimeout(loop,100)}
function startCount(){if(counting||navigating)return;counting=true;deadline=performance.now()+WAIT*1000;lastTick=-1;nextBtn.hidden=false;nextBtn.innerHTML=ringHTML(hasNext?'بعدی':'پایان');nextBtn.setAttribute('aria-label',hasNext?'رفتن به حرکت بعدی؛ ادامهٔ خودکار':'پایان دوره؛ شمارش معکوس');loop()}
function cancelCount(){if(!counting)return;counting=false;clearTimeout(timer);nextBtn.innerHTML=nextHTML;nextBtn.setAttribute('aria-label',nextLabel);nextBtn.hidden=!hasNext}
function go(dir,auto){if(!ready(dir)||navigating)return;cancelCount();navigating=true;setTimeout(()=>{navigating=false},8000);try{audio.pause()}catch(e){}const u=new URL(CONFIG[dir],location.href);u.search=location.search;u.hash=auto?'autostart':'';location.href=u.href}
function finish(){counting=false;clearTimeout(timer);if(hasNext){tick(true,audio.volume);go('next',true)}else{nextBtn.innerHTML=nextHTML;nextBtn.hidden=true;rawPause();say('دورهٔ تمرین‌ها به پایان رسید؛ موسیقی پس‌زمینه متوقف شد.')}}
nextBtn.onclick=()=>{if(counting&&!hasNext){finish();return}go('next',counting)};
$('previous').onclick=()=>go('previous',false);
audio.addEventListener('ended',startCount);audio.addEventListener('play',cancelCount);audio.addEventListener('seeking',()=>{if(counting)cancelCount()});
$('stop').addEventListener('click',cancelCount);$('repeat').addEventListener('click',cancelCount);$('play').addEventListener('click',cancelCount);$('seek').addEventListener('input',cancelCount);
audio.addEventListener('play',()=>prefetchNext(hasNext?CONFIG.next:''),{once:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden||navigating)return;const was=counting;cancelCount();if(!audio.paused)audio.pause();rawPause();if(was)say('با خروج از صفحه، ادامهٔ خودکار متوقف شد.')});
if(location.hash==='#autostart'){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}const run=()=>{window.scrollTo(0,0);Promise.resolve(P.play()).catch(()=>{})};if(document.readyState==='complete')setTimeout(run,350);else window.addEventListener('load',()=>setTimeout(run,350),{once:true})}
window.HyFlow={get counting(){return counting},startCount,cancelCount};
})();</script>
