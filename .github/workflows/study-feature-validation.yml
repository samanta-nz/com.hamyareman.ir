name: Study and dashboard feature validation

on:
  push:
    branches: [feat/study-audio-dashboard-sync-20261003]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: study-feature-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build grade 9 debug
        run: ./gradlew --console=plain :hamyar-app:assembleP09Debug :hamyar-app:testP09DebugUnitTest --stacktrace
      - name: Android lint
        run: ./gradlew --console=plain :hamyar-app:lintP09Debug --stacktrace
