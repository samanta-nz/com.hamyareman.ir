name: Verify bucket content 3.0.8
on:
  push:
    branches: [codex/bucket-3.0.8, codex/journey-3.0.9]
    paths:
      - "apps/**"
      - "shared/**"
      - "scripts/audit_bucket_routes.py"
      - ".github/workflows/**"
      - "config/grade9-release-policy.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate all bucket routes
        run: python3 scripts/audit_bucket_routes.py
      - name: Verify actual journey envelope against server key
        if: github.ref_name == 'codex/journey-3.0.9'
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID || '6abb134a002025222005' }}
          APPWRITE_DATABASE_ID: '6abb238d000d05730d10'
        run: |
          python3 -m pip install requests cryptography
          python3 scripts/verify_journey_envelope.py
      - name: Test and build
        run: ./gradlew --console=plain :core-common:testDebugUnitTest :feature-study:testDebugUnitTest :hamyar-app:testP09DebugUnitTest :hamyar-app:assembleP09Release
      - name: Verify APK contains no bundled lesson payload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apk = next(Path("apps/hamyar-app/build/outputs/apk/p09/release").glob("*.apk"))
          with zipfile.ZipFile(apk) as z:
              forbidden = [n for n in z.namelist() if n.startswith("assets/") and n.lower().endswith((".html", ".pdf", ".mp3", ".opus", ".mp4"))]
              assert not forbidden, forbidden
          print("APK_REMOTE_CONTENT_ONLY_VERIFIED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bucket-3.0.8-verification
          path: |
            apps/hamyar-app/build/outputs/apk/p09/release/*.apk
            **/build/reports/tests/**
            **/build/test-results/**
            ci-report/journey-envelope.json
