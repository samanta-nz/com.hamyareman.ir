name: Typography + health CI

on:
  push:
    branches: [feat/typography-health-routine-20261003]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
      - run: ./gradlew --console=plain :core-common:testDebugUnitTest :hamyar-app:testP09DebugUnitTest :hamyar-app:assembleP09Debug --stacktrace
      - name: Verify APK
        run: |
          set -euo pipefail
          mapfile -t files < <(find apps/hamyar-app/build/outputs/apk/p09/debug -type f -name '*.apk' -print)
          test "${#files[@]}" -eq 1
          BADGING="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging "${files[0]}" | head -1)"
          echo "$BADGING" | grep -F "name='com.hamyareman.p09'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "${files[0]}"
          mkdir -p dist
          cp "${files[0]}" dist/hamyar-grade9-ci.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hamyar-grade9-typography-health-ci
          path: dist/hamyar-grade9-ci.apk
          if-no-files-found: error
          retention-days: 7