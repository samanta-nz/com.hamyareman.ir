name: Deploy Prompt 03 (guided sessions)

# اجرای دستی deploy پرامپت ۰۳ (migration + آپلود + seed جلسات هدایت‌شده) روی Appwrite production.
# الگو: deploy-prompt-02.yml (همان envها، همان secrets، همان ساختار idempotent)
# - ۳ گام: migrate → upload assets → seed ۴۵ جلسه
# - هر گام idempotent است (skip اگر موجود باشد)
# - می‌توان با workflow_dispatch دستی اجرا کرد

on:
  workflow_dispatch:
    inputs:
      skip_migration:
        description: 'اگر true، migration را اجرا نکن (فقط upload + seed)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_upload:
        description: 'اگر true، آپلود فایل‌ها را انجام نده (فقط migration + seed)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_seed:
        description: 'اگر true، seed کردن ۴۵ جلسه را انجام نده'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  deploy:
    name: deploy guided sessions (migrate + upload + seed)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
      APPWRITE_PROJECT_ID: 6a9d59e3002751cc3ea8
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
      APPWRITE_DATABASE_ID: ZahraDB
      APPWRITE_BUCKET_ID: 6aa1eaae00303400117b

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: archive/backend/seed/package-lock.json

      - name: 📦 نصب وابستگی‌ها
        working-directory: archive/backend/seed
        run: npm ci

      - name: 🗄 گام ۱/۴ — Migration (جداول guided_sessions و guided_progress)
        if: github.event.inputs.skip_migration != 'true'
        working-directory: archive/backend/seed
        run: |
          echo "▶ اجرای migrate-prompt-03.js ..."
          node migrate-prompt-03.js
          echo "✅ Migration تمام شد."

      - name: 🧹 گام ۲/۴ — پاکسازی سطرهای تکراری (قبل از seed)
        if: github.event.inputs.skip_seed != 'true'
        working-directory: archive/backend/seed
        run: |
          echo "▶ اجرای cleanup-guided-sessions.js ..."
          node cleanup-guided-sessions.js
          echo "✅ پاکسازی تمام شد."

      - name: 📤 گام ۳/۴ — آپلود تصاویر + صوت جلسات
        if: github.event.inputs.skip_upload != 'true'
        working-directory: archive/backend/seed
        run: |
          echo "▶ شمارش فایل‌ها برای آپلود ..."
          REF_COUNT=$(find ../../archive/artifacts/prompt-03-push/guided-references -type f \( -name "*.jpg" -o -name "*.png" \) 2>/dev/null | wc -l)
          AUDIO_COUNT=$(find ../../archive/artifacts/prompt-03-push/guided-audio -type f -name "*.mp3" 2>/dev/null | wc -l)
          echo "  تصویر: $REF_COUNT فایل"
          echo "  صوت:   $AUDIO_COUNT فایل"
          echo "  جمع:   $((REF_COUNT + AUDIO_COUNT)) فایل"
          echo ""
          echo "▶ اجرای upload-guided-assets.js ..."
          node upload-guided-assets.js

      - name: 🌱 گام ۴/۴ — Seed ۴۵ جلسه به guided_sessions
        if: github.event.inputs.skip_seed != 'true'
        working-directory: archive/backend/seed
        run: |
          echo "▶ اجرای seed-guided-sessions.js ..."
          node seed-guided-sessions.js
          echo "✅ Seed تمام شد."

      - name: ✅ تأیید نهایی
        if: always()
        run: |
          echo ""
          echo "═══════════════════════════════════════"
          echo "  📋 خلاصه‌ی deploy پرامپت ۰۳"
          echo "═══════════════════════════════════════"
          echo "  endpoint: $APPWRITE_ENDPOINT"
          echo "  project:  $APPWRITE_PROJECT_ID"
          echo "  database: $APPWRITE_DATABASE_ID"
          echo ""
          if [ "${{ github.event.inputs.skip_migration }}" != "true" ]; then
            echo "  ✅ migration: اجرا شد (guided_sessions + guided_progress)"
          else
            echo "  ⏭ migration: رد شد"
          fi
          if [ "${{ github.event.inputs.skip_upload }}" != "true" ]; then
            echo "  ✅ upload:   اجرا شد"
          else
            echo "  ⏭ upload:   رد شد"
          fi
          if [ "${{ github.event.inputs.skip_seed }}" != "true" ]; then
            echo "  ✅ seed:     اجرا شد (هدف: ۳۰ mindfulness + ۱۰ calm + ۵ hypnosis = ۴۵)"
          else
            echo "  ⏭ seed:     رد شد"
          fi
          echo "═══════════════════════════════════════"
