name: CI

on:
  push:
    branches: [main, arena/01a0ea05-com-hamyareman-ir]
  workflow_dispatch:

# یک جاب، فقط نهمِ دیباگ — بدون ادمین/R8/lint/تست تکراری تا سهمیهٔ Actions زود تمام نشود.
permissions:
  contents: write
  actions: read

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
      - name: Build, test and report compiler diagnostics
        shell: bash
        run: |
          set +e
          set -o pipefail
          ./gradlew :core-common:testDebugUnitTest :hamyar-app:testP09DebugUnitTest :hamyar-app:assembleP09Debug --stacktrace 2>&1 | tee /tmp/gradle-build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E '(^e: | error: |FAILURE:|What went wrong|Execution failed for task)' /tmp/gradle-build.log \
              | tail -n 40 \
              | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$code"
      - name: نام‌گذاری و اعتبارسنجی APK نهم
        run: |
          set -euo pipefail
          mapfile -t files < <(find apps/hamyar-app/build/outputs/apk/p09/debug -type f -name '*.apk' -print)
          test "${#files[@]}" -eq 1
          src="${files[0]}"
          BADGING="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$src" | head -1)"
          echo "$BADGING" | grep -F "name='com.hamyareman.p09'"
          SIGNING_SHA="$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs "$src" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ': ' | tr 'A-F' 'a-f')"
          EXPECTED_SIGNING_SHA=$(tr -d '[:space:]' < config/release-signing-sha256.txt | tr -d ':-' | tr 'A-F' 'a-f')
          test "$SIGNING_SHA" = "$EXPECTED_SIGNING_SHA"
          VERSION_NAME=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING")
          VERSION_NAME=${VERSION_NAME%-debug}
          test -n "$VERSION_NAME"
          mkdir -p dist
          ASSET="hamyar-grade9-${VERSION_NAME}-debug.apk"
          cp -f "$src" "dist/$ASSET"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          ls -l "dist/$ASSET"
      - name: انتشارِ APK روی Release (ci-apk)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release view ci-apk >/dev/null 2>&1 || \
            gh release create ci-apk --title "CI APK" --notes "آخرین فایل نصبی debug نهم." || true
          gh release upload ci-apk "dist/$ASSET" --clobber
          gh release view ci-apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hamyar-grade9-debug
          path: dist/${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 3
