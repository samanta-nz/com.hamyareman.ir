name: ParsPack ACL repair

# تشخیص و ترمیم فایل‌هایی که روی پارس‌پک هستند ولی ناشناس خوانده نمی‌شوند.
# بدون بیلد؛ فقط چند فراخوان S3 و HTTP.
#
# راه‌اندازی: کامیتی که پیامش با «Fix ACL» شروع شود، یا اجرای دستی.

on:
  push:
    branches: [arena/01a0efde-com-hamyareman-ir]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arena-parspack-acl
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Fix ACL')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: نصب وابستگی‌ها
        shell: bash
        run: |
          set +e
          pip install --quiet boto3 requests
          exit 0

      - name: ۱) تشخیص و ترمیم ACL
        shell: bash
        env:
          PARSPACK_ACCESS_KEY: ${{ secrets.PARSPACK_ACCESS_KEY }}
          PARSPACK_SECRET_KEY: ${{ secrets.PARSPACK_SECRET_KEY }}
        run: |
          set +e
          mkdir -p ci-report
          python3 scripts/repair_public_acl.py \
            --fix \
            --extra-key "apk/grade9/hamyar-grade9-2.2-debug.apk" \
            --out ci-report/parspack-acl.md 2>&1 | tail -n 80
          exit 0

      - name: ۲) کپی دوبارهٔ هر فایل غایب از آروان
        shell: bash
        env:
          ARVAN_ACCESS_KEY: ${{ secrets.ARVAN_ACCESS_KEY }}
          ARVAN_SECRET_KEY: ${{ secrets.ARVAN_SECRET_KEY }}
          PARSPACK_ACCESS_KEY: ${{ secrets.PARSPACK_ACCESS_KEY }}
          PARSPACK_SECRET_KEY: ${{ secrets.PARSPACK_SECRET_KEY }}
        run: |
          set +e
          ABSENT=$(python3 -c "import json;print(json.load(open('ci-report/parspack-acl.json'))['absent'])" 2>/dev/null || echo 0)
          echo "غایب: $ABSENT"
          if [ "$ABSENT" != "0" ]; then
            python3 scripts/mirror_storage.py \
              --source arvan --dest parspack \
              --out ci-report/parspack-refill.md \
              --json-out ci-report/parspack-refill.json 2>&1 | tail -n 40
          fi
          exit 0

      - name: ۳) تأیید نهایی از دید کاربر ناشناس
        shell: bash
        env:
          PARSPACK_ACCESS_KEY: ${{ secrets.PARSPACK_ACCESS_KEY }}
          PARSPACK_SECRET_KEY: ${{ secrets.PARSPACK_SECRET_KEY }}
        run: |
          set +e
          python3 scripts/repair_public_acl.py \
            --extra-key "apk/grade9/hamyar-grade9-2.2-debug.apk" \
            --out ci-report/parspack-acl-final.md 2>&1 | tail -n 40
          exit 0

      - name: ثبت گزارش روی برنچ
        if: always()
        shell: bash
        run: |
          set +e
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f ci-report/parspack-acl*.md ci-report/parspack-acl*.json ci-report/parspack-refill.* 2>/dev/null
          if ! git diff --cached --quiet; then
            git commit -m "گزارش سلامت دسترسی عمومی پارس‌پک"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          for f in ci-report/parspack-acl.md ci-report/parspack-acl-final.md; do
            if [ -f "$f" ]; then
              { echo "### $f"; cat "$f"; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit 0
