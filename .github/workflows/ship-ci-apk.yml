# مسیر سریع انتشار CI فقط برای اپ نهم. پایه‌های دیگر از publish-update.yml می‌آیند.
name: Ship grade9 CI APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        required: true
      version_name:
        required: true
      min_code:
        default: '0'
      rollout:
        default: '100'
      notes:
        default: ''

jobs:
  ship:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GRADE_ID: grade9
      PACKAGE: com.hamyareman.p09
      ROW_ID: app_release_grade9
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0'
      - name: دریافت و اعتبارسنجی APK نهم از ci-apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ASSET_NAME="hamyar-grade9-${{ inputs.version_name }}-debug.apk"
          gh release download ci-apk --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" --dir dist
          APK="dist/$ASSET_NAME"
          test -f "$APK"
          BADGING="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" | head -1)"
          echo "$BADGING" | grep -F "name='$PACKAGE'"
          echo "$BADGING" | grep -F "versionCode='${{ inputs.version_code }}'"
          SIGNING_SHA="$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ': ' | tr 'A-F' 'a-f')"
          test "${#SIGNING_SHA}" -eq 64
          EXPECTED_SIGNING_SHA=$(tr -d '[:space:]' < config/release-signing-sha256.txt | tr -d ':-' | tr 'A-F' 'a-f')
          test "$SIGNING_SHA" = "$EXPECTED_SIGNING_SHA" || { echo "APK signer mismatch"; exit 1; }
          {
            echo "APK=$APK"
            echo "ASSET_NAME=$ASSET_NAME"
            echo "SIZE=$(stat -c%s "$APK")"
            echo "SHA=$(sha256sum "$APK" | cut -d' ' -f1)"
            echo "SIGNING_SHA=$SIGNING_SHA"
          } >> "$GITHUB_ENV"

      - name: Require a newer grade9 version
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID || '6abb134a002025222005' }}
        run: |
          set -euo pipefail
          test -n "${APPWRITE_API_KEY:-}"
          python3 - <<'PY'
          import json,os,urllib.request
          url=f"https://sgp.cloud.appwrite.io/v1/tablesdb/6abb238d000d05730d10/tables/app_state/rows/{os.environ['ROW_ID']}"
          req=urllib.request.Request(url,headers={'X-Appwrite-Project':os.environ['APPWRITE_PROJECT_ID'],'X-Appwrite-Key':os.environ['APPWRITE_API_KEY']})
          with urllib.request.urlopen(req,timeout=60) as response: row=json.load(response)
          current=int(json.loads(row.get('payload') or '{}').get('latest') or 0)
          new=int('${{ inputs.version_code }}')
          if new <= current: raise SystemExit(f'versionCode must increase: {current} -> {new}')
          PY

      - name: آپلود در ریپوی عمومیِ همان کانال
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ vars.RELEASES_REPO }}"
          test -n "$REPO"
          TAG="grade9-v${{ inputs.version_name }}"
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$REPO" --title "همیار پایه نهم ${{ inputs.version_name }}" --notes "versionCode ${{ inputs.version_code }}"
          gh release upload "$TAG" "$APK#$ASSET_NAME" --repo "$REPO" --clobber
          URL="https://github.com/$REPO/releases/download/$TAG/$ASSET_NAME"
          echo "URL=$URL" >> "$GITHUB_ENV"
          CODE=$(curl -sIL -o /dev/null -w '%{http_code}' "$URL" || echo 000)
          case "$CODE" in 200|302|303) ;; *) exit 1 ;; esac

      - name: اعلام فقط در ردیف پایه نهم
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID || '6abb134a002025222005' }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          MIN_CODE: ${{ inputs.min_code }}
          ROLLOUT: ${{ inputs.rollout }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          payload={'latest':int(os.environ['VERSION_CODE']),'name':os.environ['VERSION_NAME'],
            'min':int(os.environ.get('MIN_CODE') or 0),'url':os.environ['URL'],'size':int(os.environ['SIZE']),
            'sha256':os.environ['SHA'],'chan':'stable','rollout':max(1,min(100,int(os.environ.get('ROLLOUT') or 100))),
            'notes':[x.strip() for x in os.environ.get('NOTES','').split('|') if x.strip()],
            'packageName':os.environ['PACKAGE'],'gradeId':os.environ['GRADE_ID'],'signingSha256':os.environ['SIGNING_SHA']}
          body=json.dumps({'data':{'userId':'global','key':os.environ['ROW_ID'],
            'payload':json.dumps(payload,ensure_ascii=False,separators=(',',':')),'updatedAt':int(time.time()*1000)},
            'permissions':['read("users")']},ensure_ascii=False).encode()
          url=f"https://sgp.cloud.appwrite.io/v1/tablesdb/6abb238d000d05730d10/tables/app_state/rows/{os.environ['ROW_ID']}"
          req=urllib.request.Request(url,data=body,method='PATCH',headers={'X-Appwrite-Project':os.environ['APPWRITE_PROJECT_ID'],
            'X-Appwrite-Key':os.environ['APPWRITE_API_KEY'],'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=60) as response: print('server',response.status)
          PY
