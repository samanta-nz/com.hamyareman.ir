name: Setup student_profiles table

# جدول پروفایل دانش‌آموز (ZahraDB) — ستون‌ها + ایندکس یکتای userId.
on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
      APPWRITE_PROJECT_ID: 6a9d59e3002751cc3ea8
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: 🛠 ensure table + columns + index
        run: |
          python3 << 'PY'
          import json, os, time, urllib.request, urllib.error
          EP = os.environ["APPWRITE_ENDPOINT"].rstrip("/")
          H = {"X-Appwrite-Project": os.environ["APPWRITE_PROJECT_ID"],
               "X-Appwrite-Key": os.environ["APPWRITE_API_KEY"],
               "content-type": "application/json"}
          def api(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(EP + path, data=data, method=method, headers=H)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, (json.loads(r.read().decode() or "{}"))
              except urllib.error.HTTPError as e:
                  try: return e.code, json.loads(e.read().decode() or "{}")
                  except Exception: return e.code, {}
          DB = "ZahraDB"; T = "student_profiles"
          # ۱) جدول — با امنیت سطح سند (فقط صاحب ردیف)
          code, r = api("POST", f"/tablesdb/{DB}/tables", {
              "tableId": T, "name": "student_profiles",
              "permissions": ['read("users")', 'create("users")', 'update("users")'],
              "documentSecurity": True, "enabled": True})
          print("table:", code)
          # ۲) ستون‌ها
          cols = [
              ("string",  {"key": "userId",    "size": 64,  "required": True}),
              ("string",  {"key": "email",     "size": 320, "required": True}),
              ("string",  {"key": "firstName", "size": 64,  "required": True}),
              ("string",  {"key": "lastName",  "size": 64,  "required": True}),
              ("integer", {"key": "age",       "required": True, "min": 4, "max": 100}),
              ("string",  {"key": "grade",     "size": 16,  "required": True}),
              ("string",  {"key": "phone",     "size": 16,  "required": True}),
              ("string",  {"key": "schoolName", "size": 128, "required": False}),
              ("string",  {"key": "province",   "size": 64,  "required": False}),
              ("string",  {"key": "city",       "size": 64,  "required": False}),
              ("string",  {"key": "subscription", "size": 16, "required": False}),
              ("integer", {"key": "updatedAtMs", "required": False}),
          ]
          for kind, body in cols:
              code, r = api("POST", f"/tablesdb/{DB}/tables/{T}/columns/{kind}", body)
              print("col", body["key"], code, r.get("type", ""))
          # ۳) صبر تا available شدن همه‌ی ستون‌ها
          for _ in range(30):
              code, t = api("GET", f"/tablesdb/{DB}/tables/{T}")
              pend = [c["key"] for c in t.get("columns", []) if c.get("status") not in ("available", "stale")]
              print("pending:", pend)
              if not pend: break
              time.sleep(8)
          # ۴) ایندکس یکتای userId
          code, r = api("POST", f"/tablesdb/{DB}/tables/{T}/indexes",
                        {"key": "uniq_userId", "type": "unique", "attributes": ["userId"]})
          print("index:", code, r.get("key", ""))
          print("✅ student_profiles آماده است")
          PY
