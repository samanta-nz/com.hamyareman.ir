name: Deploy teach-stats migration (v1.6)

# اجرای دستی migration جدول «آمار تدریس» روی Appwrite production.
# الگو: deploy-prompt-03.yml (همان envها/secrets) — idempotent.
on:
  workflow_dispatch:

jobs:
  migrate:
    name: migrate teach_stats table
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
      APPWRITE_PROJECT_ID: 6a9d59e3002751cc3ea8
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
      APPWRITE_DATABASE_ID: ZahraDB

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: archive/backend/seed/package-lock.json

      - name: 📦 نصب وابستگی‌ها
        working-directory: archive/backend/seed
        run: npm ci

      - name: 🗄 ساخت/به‌روزرسانی جدول teach_stats
        working-directory: archive/backend/seed
        run: |
          echo "▶ اجرای migrate-teach-stats.js ..."
          node migrate-teach-stats.js
          echo "✅ تمام شد."
