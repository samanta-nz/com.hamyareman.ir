name: Arena full build check

# بیلد «کاملِ» پروژه برای پیدا کردن خطاهای کامپایلی که CI اصلی (فقط p09 debug)
# آن‌ها را نمی‌بیند: اپ ادمین، بیلد release با R8، لینت و تست همه‌ی ماژول‌ها.
#
# دامنه: فقط پایهٔ نهم (p09) — همان «اپ بیس». هشت پایهٔ دیگر بعداً فقط با عوض‌کردن
# فهرست کتاب‌ها/تدریس‌ها و فایل‌هایشان از همین بیس مشتق می‌شوند، پس بیلدشان در
# این بررسی هیچ خطای تازه‌ای پیدا نمی‌کند و فقط وقت و سهمیهٔ Actions می‌خورد.
#
# خروجی: گزارش خلاصه در ci-report/ که خودِ ران روی همین برنچ کامیت می‌کند
# (چون لاگ/آرتیفکتِ Actions از محیط توسعه قابل دانلود نیست).
#
# برای صرفه‌جویی در سهمیهٔ Actions فقط وقتی اجرا می‌شود که پیام کامیت شامل
# «[ci-build]» باشد یا دستی (workflow_dispatch) اجرا شود.

on:
  push:
    branches: [arena/01a0efde-com-hamyareman-ir]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arena-full-build
  cancel-in-progress: true

jobs:
  full-build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ci-build]')
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never

      - name: آماده‌سازی پوشهٔ گزارش
        run: |
          rm -rf ci-report
          mkdir -p ci-report
          echo "run=${{ github.run_id }} sha=${{ github.sha }}" > ci-report/run.txt

      - name: ۱) تست واحد همهٔ ماژول‌ها
        run: |
          set -o pipefail
          ./gradlew --console=plain --stacktrace --continue \
            :core-common:testDebugUnitTest \
            :feature-pairing:testDebugUnitTest \
            :feature-playback:testDebugUnitTest \
            :feature-study:testDebugUnitTest \
            :hamyar-app:testP09DebugUnitTest 2>&1 | tee -a ci-report/gradle.log

      - name: ۲) کامپایل همهٔ ماژول‌های کتابخانه‌ای
        if: always()
        run: |
          set -o pipefail
          ./gradlew --console=plain --stacktrace --continue \
            :core-common:assembleDebug \
            :core-designsystem:assembleDebug \
            :core-appwrite:assembleDebug \
            :core-security:assembleDebug \
            :core-notifications:assembleDebug \
            :core-sync:assembleDebug \
            :feature-pairing:assembleDebug \
            :feature-hearttoheart:assembleDebug \
            :feature-calls:assembleDebug \
            :feature-playback:assembleDebug \
            :feature-study:assembleDebug 2>&1 | tee -a ci-report/gradle.log

      - name: ۳) APK دیباگِ اپ نهم + اپ ادمین
        if: always()
        run: |
          set -o pipefail
          ./gradlew --console=plain --stacktrace --continue \
            :hamyar-app:assembleP09Debug \
            :hamyar-admin:assembleDebug 2>&1 | tee -a ci-report/gradle.log

      - name: ۴) بیلد release با R8
        if: always()
        run: |
          set -o pipefail
          ./gradlew --console=plain --stacktrace \
            :hamyar-app:assembleP09Release 2>&1 | tee -a ci-report/gradle.log

      - name: ۵) لینت
        if: always()
        run: |
          set -o pipefail
          ./gradlew --console=plain --stacktrace --continue \
            :hamyar-app:lintP09Debug \
            :hamyar-admin:lintDebug 2>&1 | tee -a ci-report/gradle.log

      - name: ساخت گزارش
        if: always()
        run: python3 scripts/ci_build_report.py

      - name: کامیت گزارش روی همین برنچ
        if: always()
        run: |
          set -e
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f ci-report
          if git diff --cached --quiet; then
            echo "گزارش تغییری نکرده است."
          else
            git commit -m "گزارش بیلد CI برای ${GITHUB_SHA::7} [skip-report]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: خلاصه در صفحهٔ ران
        if: always()
        run: cat ci-report/summary.md >> "$GITHUB_STEP_SUMMARY"
