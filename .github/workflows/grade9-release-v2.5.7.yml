name: Grade 9 v2.5.7 — unified forced release

on:
  workflow_dispatch:
  push:
    branches:
      - New-graphic
    paths:
      - ".release-trigger/**"

permissions:
  contents: write

concurrency:
  group: grade9-v2.5.7-forced-release
  cancel-in-progress: true

env:
  VERSION_NAME: "2.5.7"
  VERSION_CODE: "257"
  MIN_CODE: "257"
  ROLLOUT: "100"
  GRADE_ID: "grade9"
  PACKAGE: "com.hamyareman.p09"
  ROW_ID: "app_release_grade9"
  ASSET: "hamyar-grade9-2.5.7.apk"

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check release secrets
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          PARSPACK_ACCESS_KEY: ${{ secrets.PARSPACK_ACCESS_KEY }}
          PARSPACK_SECRET_KEY: ${{ secrets.PARSPACK_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$APPWRITE_API_KEY"
          test -n "$PARSPACK_ACCESS_KEY"
          test -n "$PARSPACK_SECRET_KEY"

      - name: Run unit tests and build release APK
        run: |
          set -euo pipefail
          ./gradlew --console=plain --stacktrace \
            :core-common:testDebugUnitTest \
            :hamyar-app:testP09DebugUnitTest \
            :hamyar-app:assembleP09Release \
            -PhamyarVersionCode="$VERSION_CODE" \
            -PhamyarVersionName="$VERSION_NAME"

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p dist ci-report
          mapfile -t files < <(find apps/hamyar-app/build/outputs/apk/p09/release -type f -name '*.apk' -print)
          test "${#files[@]}" -eq 1
          cp "${files[0]}" "dist/$ASSET"
          test -s "dist/$ASSET"
          stat -c '%n %s bytes' "dist/$ASSET"
          sha256sum "dist/$ASSET" | tee ci-report/apk.sha256

      - name: Verify package version and signing certificate
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          BADGING="$($AAPT dump badging "dist/$ASSET" | head -1)"
          echo "$BADGING"
          echo "$BADGING" | grep -F "name='$PACKAGE'"
          echo "$BADGING" | grep -F "versionCode='$VERSION_CODE'"
          echo "$BADGING" | grep -F "versionName='$VERSION_NAME'"
          SIGNER="$($APKSIGNER verify --print-certs "dist/$ASSET" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ': ' | tr 'A-F' 'a-f')"
          EXPECTED="$(tr -d '[:space:]' < config/release-signing-sha256.txt | tr -d ':-' | tr 'A-F' 'a-f')"
          test -n "$SIGNER"
          test "$SIGNER" = "$EXPECTED"
          echo "SIGNER_SHA256=$SIGNER" >> "$GITHUB_ENV"

      - name: Publish canonical GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO || github.repository }}
        run: |
          set -euo pipefail
          TAG="grade9-v$VERSION_NAME"
          if ! gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$RELEASES_REPO" \
              --title "همیار من نهم $VERSION_NAME" \
              --notes "نسخه 2.5.7 — انتشار اجباری برای همه نسخه‌های قدیمی‌تر."
          fi
          gh release upload "$TAG" "dist/$ASSET" --repo "$RELEASES_REPO" --clobber
          URL="https://github.com/$RELEASES_REPO/releases/download/$TAG/$ASSET"
          curl --fail --silent --show-error --location --range 0-1023 "$URL" -o /tmp/apk-head.bin
          test "$(head -c 2 /tmp/apk-head.bin)" = "PK"
          echo "EXTERNAL_URL=$URL" >> "$GITHUB_ENV"

      - name: Publish ParsPack object and verify anonymous read
        env:
          PARSPACK_ACCESS_KEY: ${{ secrets.PARSPACK_ACCESS_KEY }}
          PARSPACK_SECRET_KEY: ${{ secrets.PARSPACK_SECRET_KEY }}
        run: |
          set -euo pipefail
          pip install --quiet boto3 requests
          python3 scripts/put_public_object.py \
            --file "dist/$ASSET" \
            --key "apk/$GRADE_ID/$ASSET" \
            --provider parspack \
            --content-type application/vnd.android.package-archive \
            --env-name INTERNAL_URL

      - name: Publish forced update row to Appwrite
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID || '6abb134a002025222005' }}
        run: |
          set -euo pipefail
          python3 scripts/publish_grade9_update.py \
            --apk "dist/$ASSET" \
            --version-code "$VERSION_CODE" \
            --version-name "$VERSION_NAME" \
            --min-code "$MIN_CODE" \
            --rollout "$ROLLOUT" \
            --external-url "$EXTERNAL_URL" \
            --internal-url "$INTERNAL_URL" \
            --signer-sha256 "$SIGNER_SHA256" \
            --row-id "$ROW_ID" \
            --package "$PACKAGE" \
            --grade-id "$GRADE_ID" \
            --notes "بازگردانی فونت پیش‌فرض|آلارم‌های بیداری مشتق از ساعت حضور و زمان آماده‌سازی|تعطیلی مدرسه ۱ تا ۱۳ فروردین|رفع فضای خالی «بشنو و بخواب»|رفع Space و تراز خطوط دفترها|تکمیل دفتر شعر و عنوان قابل ویرایش|جابجایی مستقیم عکس روی کاغذ|تورق یک‌تپ و دو‌تپ|حذف دفتر خاطرات قدیمی از آلبوم امن|رفع پخش رسانه‌های محلی|افزودن راهنمای کاربری و راهنمای علامت سؤال" \
            --out ci-report/release-2.5.7.json

      - name: Verify Appwrite publication
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("ci-report/release-2.5.7.json").read_text(encoding="utf-8"))
          assert report["published"] is True
          payload = report["payload"]
          assert int(payload["latest"]) == 257
          assert int(payload["min"]) == 257
          assert int(payload["rollout"]) == 100
          assert payload["packageName"] == "com.hamyareman.p09"
          assert payload["gradeId"] == "grade9"
          assert payload["externalUrl"]
          assert payload["internalUrl"]
          print("FINAL_RELEASE_VERIFIED")
          PY

      - name: Upload APK and release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hamyar-grade9-2.5.7-release
          path: |
            dist/*.apk
            ci-report/**
          if-no-files-found: warn
          retention-days: 14
