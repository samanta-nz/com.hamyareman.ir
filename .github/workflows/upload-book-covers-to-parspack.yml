name: Upload remaining book covers to ParsPack

on:
  push:
    branches: [New-graphic]
    paths:
      - ".github/workflows/upload-book-covers-to-parspack.yml"
      - "scripts/upload_book_covers_to_parspack.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parspack-book-covers
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PARSPACK_ACCESS_KEY: ${{ secrets.PARSPACK_ACCESS_KEY }}
      PARSPACK_SECRET_KEY: ${{ secrets.PARSPACK_SECRET_KEY }}
    steps:
      - name: Checkout uploader
        uses: actions/checkout@v4
        with:
          ref: New-graphic

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install S3 upload dependencies
        run: python -m pip install --disable-pip-version-check --quiet boto3 requests

      - name: Fetch the exact 12 book cover images
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/samanta-nz/Books-Data.git /tmp/books-data
          SOURCE="/tmp/books-data/Bucket/Html-files/assets/book-covers"
          test -d "$SOURCE"
          COUNT="$(find "$SOURCE" -maxdepth 1 -type f | wc -l)"
          test "$COUNT" -eq 12
          echo "Books-Data main: $(git -C /tmp/books-data rev-parse HEAD)"
          echo "Book-cover image files found: $COUNT"

      - name: Upload book covers and verify public bytes
        run: |
          set -euo pipefail
          python scripts/upload_book_covers_to_parspack.py --source /tmp/books-data/Bucket/Html-files/assets/book-covers --report ci-report/book-covers-upload.md

      - name: Publish verification summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ParsPack book-cover upload"
            cat ci-report/book-covers-upload.md 2>/dev/null || echo "No book-cover upload report was generated."
          } >> "$GITHUB_STEP_SUMMARY"
