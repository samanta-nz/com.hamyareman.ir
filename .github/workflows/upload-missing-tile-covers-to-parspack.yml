name: Generate and upload missing wellness tile covers

on:
  push:
    branches: [New-graphic]
    paths:
      - ".github/workflows/upload-missing-tile-covers-to-parspack.yml"
      - "scripts/generate_missing_tile_covers.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parspack-missing-wellness-tile-covers
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PARSPACK_ACCESS_KEY: ${{ secrets.PARSPACK_ACCESS_KEY }}
      PARSPACK_SECRET_KEY: ${{ secrets.PARSPACK_SECRET_KEY }}
    steps:
      - name: Checkout New-graphic
        uses: actions/checkout@v4
        with:
          ref: New-graphic

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image and S3 dependencies
        run: python -m pip install --disable-pip-version-check --quiet Pillow boto3 requests

      - name: Generate covers and upload them with public hash verification
        run: |
          set -euo pipefail
          python scripts/generate_missing_tile_covers.py \
            --source apps/hamyar-app/src/main/assets/practice-covers \
            --report ci-report/missing-tile-covers-upload.md

      - name: Commit generated APK cover assets to New-graphic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git add \
            apps/hamyar-app/src/main/assets/practice-covers/hl-sleep-prep.jpg \
            apps/hamyar-app/src/main/assets/practice-covers/sd-study.jpg \
            apps/hamyar-app/src/main/assets/practice-covers/sd-stress.jpg \
            apps/hamyar-app/src/main/assets/practice-covers/sd-nature.jpg \
            apps/hamyar-app/src/main/assets/practice-covers/sd-noise.jpg \
            apps/hamyar-app/src/main/assets/practice-covers/sd-freq.jpg \
            apps/hamyar-app/src/main/assets/practice-covers/sd-sleep.jpg
          if git diff --cached --quiet; then
            echo "Generated cover assets are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add generated wellness menu tile covers [skip-release]"
          git push origin HEAD:New-graphic

      - name: Publish verification summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Generated wellness tile covers / ParsPack"
            cat ci-report/missing-tile-covers-upload.md 2>/dev/null || echo "No upload report was generated."
          } >> "$GITHUB_STEP_SUMMARY"
