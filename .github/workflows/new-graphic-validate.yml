name: New-graphic package and player validation

# Single validation path: compile/tests, requirements audit, and APK-output guard. Never assembles an APK.

on:
  push:
    branches: [New-graphic]
    paths-ignore:
      - 'new-graphic-session/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: new-graphic-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate design fallbacks
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/new_graphic_generate_assets.py

      - name: Static graphic acceptance checks
        run: |
          python - <<'PY'
          from pathlib import Path

          checks = {
              "shared/core-designsystem/src/main/java/com/hamyareman/ir/platform/core/designsystem/PinLockGate.kt": ["PatternLockGrid", "LockVariant", "SafeSpace", "PatternFeedback.Success"],
              "apps/hamyar-app/src/main/java/com/hamyareman/ir/ui/components/LinedNotebook.kt": ["headerOnFirstLine", "RealisticBookPage", "NOTEBOOK_PAGE_SEPARATOR"],
              "apps/hamyar-app/src/main/java/com/hamyareman/ir/ui/components/BookSkin.kt": ["firstLineY", "lineSpacing", "BookSkinSpread", "BookSkinCover"],
              "apps/hamyar-app/src/main/java/com/hamyareman/ir/ui/safespace/DiaryScreens.kt": ["RealisticDeskFrame", "DIARY_DESK", "LinedNotebookInput", "BookSkinSpread", "BookSkinCover"],
              "apps/hamyar-app/src/main/java/com/hamyareman/ir/ui/safespace/PoetryBookScreen.kt": ["RealisticDeskFrame", "POETRY_BG", "PoetryHemistichEditor", "BookSkin.LeatherBrown", "BookSkinSpread"],
              "apps/hamyar-app/src/main/java/com/hamyareman/ir/ui/components/BookVisualEngine.kt": ["RealisticBookPage", "stackDepth", "rotationY", "shadowElevation", "cameraDistance", "skinned"],
              "apps/hamyar-app/src/main/java/com/hamyareman/ir/ui/components/RealisticUi.kt": ["RealisticDeskFrame", "RealisticCoverTile", "RealisticIconAction", "MaterialTheme.colorScheme.primary"],
              "shared/core-designsystem/src/main/java/com/hamyareman/ir/platform/core/designsystem/Components.kt": ["ControlShape", "CardShape", "ButtonDefaults.buttonElevation", "TopAppBarDefaults.topAppBarColors"],
              "apps/hamyar-app/src/main/java/com/hamyareman/ir/ui/components/DesignAssets.kt": ["https://", "removePrefix(\"assets/\")", "readable(remote)", "COVER_LEATHER_INSIDE", "COVER_NAVY_FLORAL_SHEET"],
              "apps/hamyar-app/src/main/java/com/hamyareman/ir/ui/study/SecureMediaGallery.kt": ["RealisticDeskFrame", "ALBUM_BG", "GridCells.Adaptive"],
          }

          forbidden = [
              Path("apps/hamyar-app/src/main/assets/content/background-music.html"),
              Path("apps/hamyar-app/src/main/assets/practice-covers/hl-sleep-calm.jpg"),
              Path("apps/hamyar-app/src/main/assets/book-covers/C908.jpg"),
              Path("apps/hamyar-app/src/main/assets/book-covers/C911.jpg"),
          ]

          errors = []

          for path, tokens in checks.items():
              source = Path(path).read_text(encoding="utf-8")
              for token in tokens:
                  if token not in source:
                      errors.append(f"missing {token} in {path}")

          found = [str(p) for p in forbidden if p.exists()]
          if found:
              errors.append("removed legacy assets still exist: " + ", ".join(found))

          if Path("apps/hamyareman").exists():
              errors.append("stray directory still present: apps/hamyareman")

          for rel in ["lock/app-lock-bg.jpg", "lock/safespace-lock-bg.jpg", "diary/desk-bg.jpg", "poetry/poetry-bg.jpg", "album/album-bg.jpg"]:
              real = Path("assets") / rel
              generated = Path("apps/hamyar-app/src/main/assets") / rel
              if real.exists() and generated.exists():
                  errors.append(f"duplicate asset (real + generated): {rel}")
              if not (real.exists() or generated.exists()):
                  errors.append(f"asset missing: {rel}")

          for name in ["cover-leather-brown", "cover-navy-floral"]:
              for suffix in ["", "-inside", "-sheet"]:
                  p = Path("assets/diary") / f"{name}{suffix}.png"
                  if not p.exists() or p.stat().st_size < 20000:
                      errors.append(f"book png missing/too small: {p}")

          if errors:
              raise SystemExit("\n".join(errors))

          print("static graphic acceptance: PASS")
          print("legacy asset guard: PASS")
          PY

      - name: Verify immediate update gate
        run: python3 scripts/verify_update_gate.py

      - name: Verify player lifecycle contracts
        run: python3 scripts/verify_player_lifecycle.py

      - name: Compile and JVM unit tests
        run: |
          ./gradlew --no-daemon --console=plain --stacktrace             :hamyar-app:compileP09DebugKotlin             :core-common:testDebugUnitTest             :hamyar-app:testP09DebugUnitTest

      - name: Compare New-graphic requirements
        run: |
          python3 scripts/new_graphic_compare.py

      - name: Verify no APK was produced
        run: |
          if find . -type f -name '*.apk' -not -path './.git/*' | grep -q .; then
            echo "ERROR: APK output detected; this validation must not build an APK."
            find . -type f -name '*.apk' -not -path './.git/*' -print
            exit 1
          fi
          echo "APK output guard: PASS"

  release:
    name: Build and publish 2.5.8 to ParsPack
    needs: validate
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release grade 9 v2.5.8')
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      VERSION_NAME: '2.5.8'
      VERSION_CODE: '258'
      MIN_CODE: '258'
      GRADE_ID: grade9
      PACKAGE: com.hamyareman.p09
      ASSET: hamyar-grade9-2.5.8.apk
      ROW_ID: app_release_grade9
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify release secrets
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          PARSPACK_ACCESS_KEY: ${{ secrets.PARSPACK_ACCESS_KEY }}
          PARSPACK_SECRET_KEY: ${{ secrets.PARSPACK_SECRET_KEY }}
        run: |
          set -euo pipefail
          missing=""
          for name in APPWRITE_API_KEY PARSPACK_ACCESS_KEY PARSPACK_SECRET_KEY; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required release secrets:$missing"
            exit 1
          fi

      - name: Build 2.5.8 release APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain --stacktrace             :core-common:testDebugUnitTest             :hamyar-app:testP09DebugUnitTest             :hamyar-app:assembleP09Release             -PhamyarVersionCode="$VERSION_CODE"             -PhamyarVersionName="$VERSION_NAME"
          mkdir -p dist
          mapfile -t files < <(find apps/hamyar-app/build/outputs/apk/p09/release -type f -name '*.apk' -print)
          test "${#files[@]}" -eq 1
          cp -f "${files[0]}" "dist/$ASSET"
          test -s "dist/$ASSET"
          APK_BYTES=$(stat -c%s "dist/$ASSET")
          echo "APK_BYTES=$APK_BYTES"
          test "$APK_BYTES" -le $((60*1024*1024))

      - name: Verify APK identity and signing
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          BADGING="$($AAPT dump badging "dist/$ASSET" | head -1)"
          echo "$BADGING"
          grep -F "name='$PACKAGE'" <<<"$BADGING"
          grep -F "versionCode='$VERSION_CODE'" <<<"$BADGING"
          grep -F "versionName='$VERSION_NAME'" <<<"$BADGING"
          SIGNER="$($APKSIGNER verify --print-certs "dist/$ASSET" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ': ' | tr 'A-F' 'a-f')"
          EXPECTED=$(tr -d '[:space:]' < config/release-signing-sha256.txt | tr -d ':-' | tr 'A-F' 'a-f')
          test "$SIGNER" = "$EXPECTED" || { echo "::error::Signing certificate changed"; exit 1; }
          sha256sum "dist/$ASSET"
          echo "SIGNER_SHA256=$SIGNER" >> "$GITHUB_ENV"

      - name: Upload APK to ParsPack and prove anonymous download
        env:
          PARSPACK_ACCESS_KEY: ${{ secrets.PARSPACK_ACCESS_KEY }}
          PARSPACK_SECRET_KEY: ${{ secrets.PARSPACK_SECRET_KEY }}
        run: |
          set -euo pipefail
          python -m pip install --quiet boto3 requests botocore
          python3 scripts/put_public_object.py             --file "dist/$ASSET"             --key "apk/$GRADE_ID/$ASSET"             --provider parspack             --content-type application/vnd.android.package-archive             --env-name INTERNAL_URL

      - name: Publish 2.5.8 as mandatory update
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID || '6abb134a002025222005' }}
        run: |
          set -euo pipefail
          test -n "${INTERNAL_URL:-}"
          mkdir -p ci-report
          python3 scripts/publish_grade9_update.py             --apk "dist/$ASSET"             --version-code "$VERSION_CODE"             --version-name "$VERSION_NAME"             --min-code "$MIN_CODE"             --rollout 100             --internal-url "$INTERNAL_URL"             --signer-sha256 "$SIGNER_SHA256"             --row-id "$ROW_ID"             --package "$PACKAGE"             --grade-id "$GRADE_ID"             --notes "پشتیبانی پایدارتر پخش صوت در قفل صفحه|حفظ پخش نجواهای آرام‌بخش طبیعت هنگام جابه‌جایی تا انتخاب کاربر|پنجرهٔ آپدیت اجباری از اولین بازشدن برنامه"             --out ci-report/release-2.5.8.json

      - name: Archive release artifact
        uses: actions/upload-artifact@v4
        with:
          name: hamyar-grade9-2.5.8
          path: dist/hamyar-grade9-2.5.8.apk
          if-no-files-found: error
          retention-days: 14

