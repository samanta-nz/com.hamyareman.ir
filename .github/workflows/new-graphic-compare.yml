name: New-graphic requirements comparison

on:
  push:
    branches: [New-graphic]
    paths-ignore:
      - 'new-graphic-session/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: new-graphic-compare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout New-graphic
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Compare requirements against implementation
        run: python3 scripts/new_graphic_compare.py

      - name: Publish comparison report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add new-graphic-session/COMPARISON.md
          git commit -m '[new-graphic-compare] record requirements audit' || true
          git push origin HEAD:New-graphic || true
