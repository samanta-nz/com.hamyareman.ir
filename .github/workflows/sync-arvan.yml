name: Sync Appwrite → Arvan atomically

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'بازنشر حتی وقتی hash یکسان است'
        type: boolean
        default: false
  schedule:
    - cron: '0 */6 * * *'

# دو mirror هم‌زمان هرگز روی staging/final کار نکنند.
concurrency:
  group: hamyar-content-mirror
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install --quiet requests boto3
      - name: Atomic mirror
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 6a9d59e3002751cc3ea8
          APPWRITE_BUCKET_ID: 6aa1eaae00303400117b
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          ARVAN_ACCESS_KEY: ${{ secrets.ARVAN_ACCESS_KEY }}
          ARVAN_SECRET_KEY: ${{ secrets.ARVAN_SECRET_KEY }}
          ARVAN_ENDPOINT: https://s3.ir-thr-at1.arvanstorage.ir
          ARVAN_REGION: ir-thr-at1
          ARVAN_BUCKET: hamyar-e-man
        run: |
          set -euo pipefail
          FLAGS=()
          if [ "${{ inputs.force }}" = "true" ]; then FLAGS+=(--force); fi
          python3 scripts/sync_appwrite_to_arvan.py "${FLAGS[@]}"
          python3 scripts/verify_content_mirror.py --output mirror-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-mirror-verification
          path: mirror-verification.json
          if-no-files-found: warn
          retention-days: 14
