name: Package encrypted 0000 HTML archive

# Only an explicit release marker runs this job. Raw files are streamed from main
# into runner-local temporary storage, encrypted as HMK1, and are never committed.
on:
  push:
    branches: [arena/01a0efde-com-hamyareman-ir]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-0000-hmk1
  cancel-in-progress: false

env:
  APPWRITE_ENDPOINT: https://sgp.cloud.appwrite.io/v1
  APPWRITE_PROJECT_ID: 6abb134a002025222005
  APPWRITE_DATABASE_ID: 6abb238d000d05730d10
  ARCHIVE_KEY: archives/0000-hmk1.zip

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[package-0000]')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: دریافت دقیق پوشهٔ 0000 از main
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          SOURCE_REVISION="$(git rev-parse FETCH_HEAD)"
          echo "SOURCE_REVISION=$SOURCE_REVISION" >> "$GITHUB_ENV"
          mkdir -p /tmp/hamyar-0000
          git archive FETCH_HEAD 0000 | tar -x -C /tmp/hamyar-0000
          test -d /tmp/hamyar-0000/0000
          echo "تعداد HTML: $(find /tmp/hamyar-0000/0000 -type f -name '*.html' | wc -l)"
          test "$(find /tmp/hamyar-0000/0000 -type f | wc -l)" = "$(find /tmp/hamyar-0000/0000 -type f -name '*.html' | wc -l)"

      - name: رمزگذاری HMK1 و ساخت ZIP با مسیرهای دست‌نخورده
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          HTML_MEDIA_KEY_B64: ${{ secrets.HTML_MEDIA_KEY_B64 }}
        run: |
          set -euo pipefail
          pip install --quiet requests cryptography
          python3 scripts/package_hmk1_archive.py \
            --source /tmp/hamyar-0000/0000 \
            --prefix 0000 \
            --output dist/0000-hmk1.zip \
            --report ci-report/0000-hmk1.json \
            --source-revision "$SOURCE_REVISION"

      - name: بارگذاری عمومی ZIP رمز‌شده روی ParsPack
        env:
          PARSPACK_ACCESS_KEY: ${{ secrets.PARSPACK_ACCESS_KEY }}
          PARSPACK_SECRET_KEY: ${{ secrets.PARSPACK_SECRET_KEY }}
        run: |
          set -euo pipefail
          pip install --quiet boto3 requests
          python3 scripts/put_public_object.py \
            --file dist/0000-hmk1.zip \
            --key "$ARCHIVE_KEY" \
            --provider parspack \
            --content-type application/zip \
            --cache-control 'public, max-age=31536000, immutable' \
            --env-name ARCHIVE_URL

      - name: ثبت نشانی انتشار در گزارش
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          path = 'ci-report/0000-hmk1.json'
          with open(path, encoding='utf-8') as stream:
              report = json.load(stream)
          report['publicUrl'] = os.environ['ARCHIVE_URL']
          with open(path, 'w', encoding='utf-8') as stream:
              json.dump(report, stream, ensure_ascii=False, indent=2)
              stream.write('\n')
          PY

      - name: ذخیرهٔ گزارش قابل بررسی
        if: always()
        run: |
          set +e
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add ci-report/0000-hmk1.json
          git diff --cached --quiet || git commit -m 'گزارش بستهٔ رمز‌شدهٔ 0000 [skip-report]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-0000-hmk1
          path: |
            dist/0000-hmk1.zip
            ci-report/0000-hmk1.json
          if-no-files-found: error
