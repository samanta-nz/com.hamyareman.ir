name: New-graphic ParsPack asset sync

on:
  workflow_dispatch:
  push:
    branches: [New-graphic]
    paths:
      - "scripts/new_graphic_generate_assets.py"
      - "scripts/upload_graphic_assets.py"
      - "apps/hamyar-app/src/main/assets/lock/**"
      - "apps/hamyar-app/src/main/assets/diary/**"
      - "apps/hamyar-app/src/main/assets/poetry/**"
      - "apps/hamyar-app/src/main/assets/album/**"

permissions:
  contents: write

concurrency:
  group: new-graphic-parspack-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[new-graphic-upload]')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PARSPACK_ACCESS_KEY: ${{ secrets.PARSPACK_ACCESS_KEY }}
      PARSPACK_SECRET_KEY: ${{ secrets.PARSPACK_SECRET_KEY }}
    steps:
      - name: Checkout New-graphic
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install S3 tooling
        run: python -m pip install --disable-pip-version-check --quiet boto3 requests Pillow

      - name: Generate compressed graphic assets
        run: python scripts/new_graphic_generate_assets.py

      - name: Upload and verify ParsPack assets
        run: |
          python scripts/upload_graphic_assets.py \
            --out new-graphic-session/parspack/graphic-assets.md \
            --json-out new-graphic-session/parspack/graphic-assets.json

      - name: Publish report to New-graphic
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f new-graphic-session/parspack/graphic-assets.md new-graphic-session/parspack/graphic-assets.json
          if git diff --cached --quiet; then
            echo 'No report changes.'
          else
            git commit -m "[new-graphic-report] ParsPack graphic asset sync ${GITHUB_SHA::7}"
            git pull --rebase origin New-graphic
            git push origin HEAD:New-graphic
          fi

      - name: Show report
        if: always()
        run: cat new-graphic-session/parspack/graphic-assets.md || true