name: Migrate content to ParsPack

# مهاجرت کامل محتوا از آروان (فقط‌خواندنی) به سرور داخلی تازه، با حفظ
# پوشه‌بندی و مسیر دقیق هر فایل. اول آمادگی‌سنجی، بعد آینه‌سازی.
#
# قابل‌ازسرگیری است: اجرای دوباره فقط تفاوت‌ها را می‌برد.
# راه‌اندازی: کامیتی که پیامش با «Migrate ParsPack» شروع شود.

on:
  push:
    branches: [arena/01a0efde-com-hamyareman-ir]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arena-parspack-migrate
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Migrate ParsPack')
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      PARSPACK_ACCESS_KEY: ${{ secrets.PARSPACK_ACCESS_KEY }}
      PARSPACK_SECRET_KEY: ${{ secrets.PARSPACK_SECRET_KEY }}
      ARVAN_ACCESS_KEY: ${{ secrets.ARVAN_ACCESS_KEY }}
      ARVAN_SECRET_KEY: ${{ secrets.ARVAN_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: نصب وابستگی‌ها
        run: pip install --quiet boto3 requests

      - name: ۱) آمادگی‌سنجی سرور داخلی
        id: preflight
        shell: bash
        run: |
          set +e
          mkdir -p ci-report
          if [ -z "${PARSPACK_ACCESS_KEY:-}" ] || [ -z "${PARSPACK_SECRET_KEY:-}" ]; then
            printf '# آمادگی‌سنجی\n\n❌ `PARSPACK_ACCESS_KEY` / `PARSPACK_SECRET_KEY` در Secrets مخزن نیست.\n' \
              > ci-report/parspack-preflight.md
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/preflight_parspack.py > ci-report/parspack-preflight.md 2>&1
          echo "preflight exit=$?"
          echo "ok=true" >> "$GITHUB_OUTPUT"
          cat ci-report/parspack-preflight.md || true
          exit 0

      - name: ۲) آینه‌سازی محتوا با همان پوشه‌بندی
        if: steps.preflight.outputs.ok == 'true'
        shell: bash
        run: |
          set +e
          python3 scripts/mirror_storage.py \
            --source arvan --dest parspack \
            --out ci-report/parspack-mirror.md \
            --json-out ci-report/parspack-mirror.json 2>&1 | tail -n 120
          echo "mirror exit=$?"
          exit 0

      - name: پاک‌سازی کلیدها از گزارش‌ها
        if: always()
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          names = ("PARSPACK_ACCESS_KEY", "PARSPACK_SECRET_KEY", "ARVAN_ACCESS_KEY", "ARVAN_SECRET_KEY")
          for path in Path("ci-report").glob("parspack-*"):
              text = path.read_text(encoding="utf-8", errors="replace")
              for name in names:
                  value = os.getenv(name, "").strip()
                  if len(value) > 3:
                      text = text.replace(value, f"<{name}>")
              text = re.sub(r"[A-Za-z0-9/+=]{38,}", "<redacted>", text)
              path.write_text(text, encoding="utf-8")
          PY

      - name: ثبت گزارش روی برنچ
        if: always()
        shell: bash
        run: |
          set +e
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f -A ci-report
          git diff --cached --quiet
          if [ $? -ne 0 ]; then
            git commit -m "گزارش مهاجرت به پارس‌پک"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "push exit=$?"
          else
            echo "چیزی برای کامیت نبود."
          fi
          for f in ci-report/parspack-preflight.md ci-report/parspack-mirror.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done
          exit 0
