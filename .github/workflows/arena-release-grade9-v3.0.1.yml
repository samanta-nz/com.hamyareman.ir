name: Release grade 9 v3.0.1 (optional)

# انتشار عمومی ۳٫۰٫۱ پایهٔ نهم — آپدیت اختیاری (min=0).
# ترتیب: ساخت و اعتبارسنجی → GitHub Release → ParsPack → اعلام Appwrite.
on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arena-release-grade9-v3.0.1
  cancel-in-progress: false

env:
  VERSION_NAME: '3.0.1'
  VERSION_CODE: '301'
  MIN_CODE: '0'
  ROLLOUT: '100'
  GRADE_ID: grade9
  PACKAGE: com.hamyareman.p09
  ROW_ID: app_release_grade9
  ASSET: hamyar-grade9-3.0.1.apk

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release grade 9 v3.0.1')
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 0) Проверка секретов
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          PARSPACK_ACCESS_KEY: ${{ secrets.PARSPACK_ACCESS_KEY }}
          PARSPACK_SECRET_KEY: ${{ secrets.PARSPACK_SECRET_KEY }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
        run: |
          set -euo pipefail
          missing=""
          for name in APPWRITE_API_KEY PARSPACK_ACCESS_KEY PARSPACK_SECRET_KEY; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || { echo "::error::secretهای لازم تنظیم نشده‌اند:$missing"; exit 1; }
          if [ -n "${RELEASES_TOKEN:-}" ] && [ -n "${RELEASES_REPO:-}" ]; then
            echo "PUBLIC_REPO=$RELEASES_REPO" >> "$GITHUB_ENV"
          fi

      - name: 1) Build release APK 3.0.1
        run: |
          set -euo pipefail
          ./gradlew --console=plain --stacktrace \
            :core-common:testDebugUnitTest \
            :hamyar-app:testP09DebugUnitTest \
            :hamyar-app:assembleP09Release \
            -PhamyarVersionCode="$VERSION_CODE" -PhamyarVersionName="$VERSION_NAME"
          mkdir -p dist
          mapfile -t files < <(find apps/hamyar-app/build/outputs/apk/p09/release -type f -name '*.apk' -print)
          test "${#files[@]}" -eq 1
          cp -f "${files[0]}" "dist/$ASSET"
          APK_BYTES=$(stat -c%s "dist/$ASSET")
          test "$APK_BYTES" -le $((60*1024*1024))
          echo "APK_BYTES=$APK_BYTES" >> "$GITHUB_ENV"
          ls -lh "dist/$ASSET"

      - name: 2) Verify package, version, signer and digest
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          BADGING="$($AAPT dump badging "dist/$ASSET" | head -1)"
          echo "$BADGING"
          grep -F "name='$PACKAGE'" <<<"$BADGING"
          grep -F "versionCode='$VERSION_CODE'" <<<"$BADGING"
          grep -F "versionName='$VERSION_NAME'" <<<"$BADGING"
          SIGNER="$($APKSIGNER verify --print-certs "dist/$ASSET" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ': ' | tr 'A-F' 'a-f')"
          EXPECTED=$(tr -d '[:space:]' < config/release-signing-sha256.txt | tr -d ':-' | tr 'A-F' 'a-f')
          test "$SIGNER" = "$EXPECTED"
          echo "SIGNER_SHA256=$SIGNER" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(stat -c%s "dist/$ASSET")" >> "$GITHUB_ENV"
          echo "APK_SHA256=$(sha256sum "dist/$ASSET" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: 3) Archive on ci-apk release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view ci-apk >/dev/null 2>&1 || gh release create ci-apk --title "CI APK" --notes "آخرین فایل release پایه نهم."
          gh release delete-asset ci-apk "$ASSET" -y >/dev/null 2>&1 || true
          gh release upload ci-apk "dist/$ASSET" --clobber
          HAVE=$(gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/ci-apk" -q ".assets[]|select(.name==\"$ASSET\")|.size" | head -1)
          test "$HAVE" = "$APK_SIZE"
          echo "FALLBACK_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/ci-apk/$ASSET" >> "$GITHUB_ENV"

      - name: 4) Publish external release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_REPO:-}" ]; then
            echo "EXTERNAL_URL=$FALLBACK_URL" >> "$GITHUB_ENV"
            exit 0
          fi
          TAG="grade9-v$VERSION_NAME"
          gh release view "$TAG" --repo "$PUBLIC_REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$PUBLIC_REPO" --title "همیار من نهم $VERSION_NAME" --notes "versionCode $VERSION_CODE — آپدیت اختیاری"
          gh release upload "$TAG" "dist/$ASSET" --repo "$PUBLIC_REPO" --clobber
          URL="https://github.com/$PUBLIC_REPO/releases/download/$TAG/$ASSET"
          CODE=$(curl -sIL -o /dev/null -w '%{http_code}' "$URL" || echo 000)
          case "$CODE" in 200|302|303) ;; *) echo "::error::external asset HTTP $CODE"; exit 1 ;; esac
          echo "EXTERNAL_URL=$URL" >> "$GITHUB_ENV"

      - name: 5) Upload to ParsPack
        env:
          PARSPACK_ACCESS_KEY: ${{ secrets.PARSPACK_ACCESS_KEY }}
          PARSPACK_SECRET_KEY: ${{ secrets.PARSPACK_SECRET_KEY }}
        run: |
          set -euo pipefail
          pip install --quiet boto3 requests
          python3 scripts/put_public_object.py \
            --file "dist/$ASSET" \
            --key "apk/$GRADE_ID/$ASSET" \
            --provider parspack \
            --content-type application/vnd.android.package-archive \
            --env-name INTERNAL_URL 2>&1 | tee ci-release.log

      - name: 6) Announce optional update in Appwrite
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID || '6abb134a002025222005' }}
        run: |
          set -euo pipefail
          mkdir -p ci-report
          python3 scripts/publish_grade9_update.py \
            --apk "dist/$ASSET" \
            --version-code "$VERSION_CODE" \
            --version-name "$VERSION_NAME" \
            --min-code "$MIN_CODE" \
            --rollout "$ROLLOUT" \
            --external-url "$EXTERNAL_URL" \
            --internal-url "$INTERNAL_URL" \
            --signer-sha256 "$SIGNER_SHA256" \
            --row-id "$ROW_ID" \
            --package "$PACKAGE" \
            --grade-id "$GRADE_ID" \
            --notes "نسخهٔ ۳٫۰٫۱ بر پایهٔ تغییرات دفترها و همسان‌سازی RTL|رفع پایداری قفل و PIN در تنظیمات|همسان‌سازی تراز متن و یادداشت‌های دفترها|بهبود مسیر محتوای سلامت و آموزش" \
            --out ci-report/release-3.0.1.json | tee ci-report/release-3.0.1.log

      - name: 7) Upload release reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hamyar-grade9-3.0.1-release-report
          path: |
            dist/*.apk
            ci-release.log
            ci-report/*
          if-no-files-found: warn
          retention-days: 14
