name: One-time GitHub Release history cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-github-releases.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete every GitHub Release and its release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName \
            -q '.[].tagName' > /tmp/release-tags.txt
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes || true
            git push origin --delete "refs/tags/$tag" || true
          done < /tmp/release-tags.txt

      - name: Remove this one-time workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/cleanup-github-releases.yml
          git commit -m "حذف Releaseهای تاریخی GitHub و Workflow موقت [skip-release]"
          git push origin HEAD:main
