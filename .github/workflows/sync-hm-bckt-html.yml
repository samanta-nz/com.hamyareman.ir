name: Sync encrypted HTML to HM_BCKT

on:
  push:
    branches: [arena/01a0ea05-com-hamyareman-ir]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-hm-bckt-html
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Sync HM_BCKT HTML')
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      APPWRITE_ENDPOINT: https://sgp.cloud.appwrite.io/v1
      APPWRITE_PROJECT_ID: 6abb134a002025222005
      APPWRITE_DATABASE_ID: 6abb238d000d05730d10
      APPWRITE_BUCKET_ID: 6abb564d00155cc56d65
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
      SOURCE_APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
      SOURCE_APPWRITE_PROJECT_ID: 6a9d59e3002751cc3ea8
      SOURCE_APPWRITE_DATABASE_ID: ZahraDB
      SOURCE_APPWRITE_API_KEY: ${{ secrets.SOURCE_APPWRITE_API_KEY }}
      HTML_MEDIA_KEY_B64: ${{ secrets.HTML_MEDIA_KEY_B64 }}
      INTERNAL_CONTENT_PUBLIC: https://hamyar-e-man.s3.ir-thr-at1.arvanstorage.ir
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests appwrite
      - name: Copy only missing encrypted HTML and install the media key
        run: |
          set -euo pipefail
          python3 scripts/sync_html_to_hm_bckt.py | tee /tmp/hm-bckt-sync.log
          summary=$(tail -n 1 /tmp/hm-bckt-sync.log)
          summary=${summary//'%'/'%25'}
          summary=${summary//$'\r'/'%0D'}
          summary=${summary//$'\n'/'%0A'}
          echo "::notice title=HM_BCKT HTML sync::$summary"
