name: Probe lesson music host

# فقط-خواندنی و تشخیصی: یک فایل یوگا و یک فایل ورزش را از باکت می‌گیرد،
# رمزگشایی می‌کند و تنها بخش‌های مربوط به iframe موسیقی (متای viewport، تگ
# iframe و اسکریپت HamyaremanBackground) را در ci-report می‌نویسد تا علت واقعی
# غیب‌شدن کارت و قفل‌شدن صفحهٔ میزبان روشن شود. چیزی را تغییر نمی‌دهد.
# با «[probe-lesson]» در پیام کامیت اجرا می‌شود.

on:
  push:
    branches: [arena/01a0fe97-com-hamyareman-ir]

permissions:
  contents: write

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe-lesson]')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      APPWRITE_ENDPOINT: https://sgp.cloud.appwrite.io/v1
      APPWRITE_PROJECT_ID: 6abb134a002025222005
      APPWRITE_DATABASE_ID: 6abb238d000d05730d10
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
      HTML_MEDIA_KEY_B64: ${{ secrets.HTML_MEDIA_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests cryptography

      - name: استخراج بخش موسیقیِ فایل درس
        run: |
          mkdir -p ci-report
          python3 - <<'PY' > ci-report/lesson-music-host.md
          import base64, json, os, re, requests, urllib.parse
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          def key():
              b = os.environ.get("HTML_MEDIA_KEY_B64","").strip()
              if b:
                  raw = base64.b64decode(b)
                  if len(raw)==32: return raw
              ep=os.environ["APPWRITE_ENDPOINT"].rstrip("/")
              h={"X-Appwrite-Project":os.environ["APPWRITE_PROJECT_ID"],"X-Appwrite-Key":os.environ["APPWRITE_API_KEY"]}
              db=os.environ["APPWRITE_DATABASE_ID"]
              for p in (f"/tablesdb/{db}/tables/app_state/rows/html_media_key",
                        f"/databases/{db}/collections/app_state/documents/html_media_key"):
                  r=requests.get(ep+p,headers=h,timeout=(20,60))
                  if r.status_code==200:
                      raw=base64.b64decode(json.loads(r.json().get("payload") or "{}").get("b",""))
                      if len(raw)==32: return raw
              raise SystemExit("no key")

          aes=AESGCM(key())
          BASE="https://c539776.parspack.net"
          files=[("یوگا","Bucket/Html-files/01 - حالت کودک.html"),
                 ("ورزش","Bucket/Html-files/اسکوات آرام.html")]

          print("# بخش میزبانِ موسیقی در فایل‌های درس\n")
          for label,key_path in files:
              url=BASE+"/"+urllib.parse.quote(key_path)
              r=requests.get(url,timeout=(20,240))
              blob=r.content
              print(f"## {label} — `{key_path}`\n")
              print(f"- HTTP {r.status_code}، {len(blob):,} بایت، HMK1: {blob[:4]==b'HMK1'}")
              if blob[:4]!=b"HMK1":
                  print("\n(رمزشده نیست یا دریافت نشد)\n"); continue
              plain=aes.decrypt(blob[4:16],blob[16:],None).decode("utf-8","replace")
              print(f"- طول متنِ رمزگشایی‌شده: {len(plain):,} نویسه\n")

              m=re.search(r'<meta[^>]*name=["\']viewport["\'][^>]*>',plain,re.I)
              print("### متای viewport\n\n```html\n"+(m.group(0) if m else "(ندارد — WebView عرض پیش‌فرض ۹۸۰ را می‌گیرد)")+"\n```\n")

              print("### تگ‌های iframe\n")
              for t in re.findall(r'<iframe[\s\S]{0,400}?>',plain,re.I):
                  print("```html\n"+t.strip()+"\n```\n")

              print("### هر جای کد که iframe موسیقی را می‌سازد/تغییر می‌دهد\n")
              hits=[]
              for pat in [r'HamyaremanBackground', r'background-music', r'\.src\s*=', r'function\s+resize',
                          r'cssText', r'appendChild\s*\(\s*frame', r'insertBefore', r'removeChild',
                          r'replaceChild', r'postMessage', r'setTimeout', r'requestFullscreen']:
                  for mm in re.finditer(pat,plain):
                      hits.append((mm.start(),pat))
              hits.sort()
              seen=set(); out=[]
              for pos,pat in hits:
                  blk=(pos//700)
                  if blk in seen: continue
                  seen.add(blk)
                  out.append(plain[max(0,pos-350):pos+450])
              print("```js\n"+("\n\n/* ---- */\n\n".join(out))[:24000]+"\n```\n")
          PY

      - name: کامیت گزارش
        if: always()
        run: |
          set +e
          head -c 60000 ci-report/lesson-music-host.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f ci-report/lesson-music-host.md
          git diff --cached --quiet || { git commit -m "گزارش میزبان موسیقی در فایل درس [skip-report]"; git pull --rebase origin "${GITHUB_REF_NAME}"; git push origin "HEAD:${GITHUB_REF_NAME}"; }
          exit 0
