name: Probe ParsPack public paths

# فقط خواندن: کدام شکل آدرس عمومی پارس‌پک فایل‌های Bucket/ را می‌دهد؟
# با «[pp-probe]» در پیام کامیت یا دستی.

on:
  push:
    branches: [arena/01a0efde-com-hamyareman-ir]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pp-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pp-probe]')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests
      - name: سنجش شکل‌های آدرس
        run: |
          set +e
          python3 scripts/probe_parspack_paths.py
          exit 0
      - name: خلاصه
        if: always()
        run: |
          set +e
          cat ci-report/parspack-path-probe.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "گزارشی نیست." >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: کامیت گزارش
        if: always()
        run: |
          set +e
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f ci-report/parspack-path-probe.md ci-report/parspack-path-probe.json
          if git diff --cached --quiet; then echo "بدون تغییر"; else
            git commit -m "گزارش شکل آدرس پارس‌پک ${GITHUB_SHA::7} [skip-report]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          exit 0
