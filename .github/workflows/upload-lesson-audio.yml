name: Upload lesson audio (روخوانی درس‌ها)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'فقط فهرست (بدون آپلود واقعی)'
        required: false
        default: 'false'
      force:
        description: 'حذف و آپلود مجدد حتی اگر فایل موجود باشد'
        required: false
        default: 'false'
      list_only:
        description: 'فقط فهرست کامل باکت'
        required: false
        default: 'false'
      convention:
        description: 'یکدست‌سازی با قرارداد: صوت/ویدیوی ناقص + حذف بخش‌های اضافی'
        required: false
        default: 'false'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        working-directory: archive/backend/seed
        run: npm ci

      - name: Upload audio + sync lesson_audio table
        working-directory: archive/backend/seed
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 6a9d59e3002751cc3ea8
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_BUCKET_ID: 6aa1eaae00303400117b
          APPWRITE_DATABASE_ID: ZahraDB
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then FLAGS="$FLAGS --force"; fi
          if [ "${{ inputs.list_only }}" = "true" ]; then FLAGS="$FLAGS --list"; fi
          if [ "${{ inputs.convention }}" = "true" ]; then FLAGS="$FLAGS --convention"; fi
          node upload-lesson-audio.js $FLAGS
