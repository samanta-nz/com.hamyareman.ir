name: Upload lesson media (Prompt 01 ops)

# آپلود رسانه‌ی واقعی درس‌ها به باکت wellness-media (عملیاتیِ پرامپت ۰۱).
#  - فقط فایل‌های واقعی (غیرصفر) با قرارداد <Cxxx>-<Lnn|E-فصل-Lnn>-<V|A><NN>.mp4|mp3 آپلود می‌شوند.
#  - placeholderهای صفر بایتی فقط شمرده می‌شوند — آپلودشان بی‌معناست.
#  - fileId = نام کامل فایل (پلیر فصل‌ها را از روی نام می‌سازد: V01→V02→V03).
#  - Idempotent: فایل موجود skip می‌شود؛ اجرای تکراری امن است.
#  - --seed-lessons: سطر lessons (videoUrl/audioUrl/hasVideo/hasAudio) فقط برای
#    درس‌هایی که رسانه‌شان واقعاً در باکت هست ساخته/به‌روز می‌شود.
#
# اسکوپ لازم در APPWRITE_API_KEY: storage.write + files.read (+ tables.write برای سید)
# فایل‌های واقعی باید در ریپو باشند (جای placeholderها) یا اسکریپت را محلی اجرا کن.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'فهرست کن، آپلود نکن (تست)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      seed_lessons:
        description: 'بعد از آپلود، سطر lessons با videoUrl/audioUrl ساخته/به‌روز شود؟'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      test_fallback:
        description: 'placeholderهای صفر بایتی با فایل مستر تست پر شوند؟ (تست زنجیره‌ی پخش)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      upgrade_test:
        description: 'فایل تستِ موجود در باکت با نسخه‌ی واقعی ریپو جایگزین شود؟'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      book:
        description: 'فقط یک کتاب (مثلاً C905) — خالی = همه'
        required: false
        default: ''
        type: string

jobs:
  upload:
    name: upload lesson media to wellness-media
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
      APPWRITE_PROJECT_ID: 6a9d59e3002751cc3ea8
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
      APPWRITE_DATABASE_ID: ZahraDB
      APPWRITE_BUCKET_ID: 6aa1eaae00303400117b

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: archive/backend/seed/package-lock.json

      - name: 📦 نصب وابستگی‌ها
        working-directory: archive/backend/seed
        run: npm ci

      - name: 🧼 نرمال‌سازی کلید (بدون whitespace)
        run: |
          echo "APPWRITE_API_KEY=$(printf '%s' "$APPWRITE_API_KEY" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: 🔑 سلامت کلید برای باکت (با خود SDK)
        working-directory: archive/backend/seed
        run: node check-appwrite-key.js storage

      - name: 🗄 مایگریشن اسکیمای lessons (وقتی سید فعال است — idempotent)
        if: github.event.inputs.seed_lessons == 'true'
        working-directory: archive/backend/seed
        run: |
          echo "▶ اجرای migrate-prompt-01.js (ستون‌های bookCode/videoUrl/... + جدول lesson_media_progress)"
          node migrate-prompt-01.js

      - name: 📤 آپلود رسانه‌ی درس‌ها
        working-directory: archive/backend/seed
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.seed_lessons }}" = "true" ]; then ARGS="$ARGS --seed-lessons"; fi
          if [ "${{ github.event.inputs.test_fallback }}" = "true" ]; then ARGS="$ARGS --test-fallback"; fi
          if [ "${{ github.event.inputs.upgrade_test }}" = "true" ]; then ARGS="$ARGS --upgrade-test"; fi
          if [ -n "${{ github.event.inputs.book }}" ]; then ARGS="$ARGS --book ${{ github.event.inputs.book }}"; fi
          echo "▶ اجرای upload-lesson-media.js $ARGS"
          node upload-lesson-media.js $ARGS

      - name: ✅ تأیید نهایی
        if: always()
        run: |
          echo ""
          echo "═══════════════════════════════════════"
          echo "  📋 خلاصه‌ی آپلود رسانه (wellness-media)"
          echo "═══════════════════════════════════════"
          echo "  bucket: $APPWRITE_BUCKET_ID"
          echo "  dry_run: ${{ github.event.inputs.dry_run }} | seed_lessons: ${{ github.event.inputs.seed_lessons }}"
          echo "  اگر بالای لاگ گفت «هیچ فایل واقعی‌ای در ریپو نیست» یعنی فایل‌های"
          echo "  واقعی هنوز جای placeholderها ننشسته‌اند (یا محلی اجرا کن)."
          echo "═══════════════════════════════════════"
