name: Encode music auto-theme pair (HMK1)

# دو فایلِ داخلِ `background-music-auto-theme.zip` را بدون هیچ تغییری با کلید
# زندهٔ محتوا رمز (HMK1) می‌کند و خروجی را به‌صورت artifact بالا می‌گذارد.
# هیچ چیزی روی باکت نوشته نمی‌شود و هیچ بایتی از خودِ فایل‌ها عوض نمی‌شود.

on:
  workflow_dispatch:
  push:
    branches: [arena/01a0fe97-com-hamyareman-ir]

concurrency:
  group: arena-music-auto-theme-encode
  cancel-in-progress: false

jobs:
  encode:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Encode music auto-theme')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ۱) باز کردن زیپ، دست‌نخورده
        run: |
          set -euo pipefail
          mkdir -p plain
          unzip -o background-music-auto-theme.zip -d plain
          ls -l plain
          sha256sum plain/*.html

      - name: ۲) رمزگذاری HMK1 با کلید زندهٔ محتوا
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID || '6abb134a002025222005' }}
          APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID || '6abb238d000d05730d10' }}
          HTML_MEDIA_KEY_B64: ${{ secrets.HTML_MEDIA_KEY_B64 }}
        run: |
          set -euo pipefail
          pip install --quiet requests cryptography
          mkdir -p ci-report
          python3 scripts/encode_hmk1_files.py \
            --source plain --out encoded \
            --report ci-report/music-auto-theme-encode.md
          ls -l encoded
          for f in encoded/*.html; do printf '%s  ' "$f"; head -c 4 "$f"; echo; done

      - uses: actions/upload-artifact@v4
        with:
          name: background-music-auto-theme-hmk1
          path: encoded/*.html
          if-no-files-found: error
          retention-days: 14

      - name: ۳) زیپِ خروجیِ رمزشده روی برنچ
        run: |
          set -euo pipefail
          cd encoded && zip -q ../background-music-auto-theme-hmk1.zip *.html && cd ..
          ls -l background-music-auto-theme-hmk1.zip
          sha256sum background-music-auto-theme-hmk1.zip

      - name: ۴) ثبت گزارش روی برنچ
        if: always()
        run: |
          set +e
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f background-music-auto-theme-hmk1.zip ci-report/music-auto-theme-encode.md
          if ! git diff --cached --quiet; then
            git commit -m "زیپ رمزشدهٔ دو قاب تمِ خودکار [skip-report]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          cat ci-report/music-auto-theme-encode.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          exit 0
