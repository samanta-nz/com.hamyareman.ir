name: Diagnose Arvan storage

# عیب‌یابی سریع اتصال آروان: بدون بیلد، بدون APK، فقط چند فراخوان S3.
# خروجی sanitize‌شده در ci-report/arvan-diagnose.md روی همین برنچ کامیت می‌شود
# (لاگ Actions از محیط توسعه قابل دانلود نیست).
#
# راه‌اندازی: کامیتی که پیامش با «Diagnose Arvan» شروع شود.

on:
  push:
    branches: [arena/01a0efde-com-hamyareman-ir]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arena-arvan-diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Diagnose Arvan')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: اجرای تشخیص
        env:
          ARVAN_ACCESS_KEY: ${{ secrets.ARVAN_ACCESS_KEY }}
          ARVAN_SECRET_KEY: ${{ secrets.ARVAN_SECRET_KEY }}
          ARVAN_ENDPOINT: https://s3.ir-thr-at1.arvanstorage.ir
          ARVAN_REGION: ir-thr-at1
          ARVAN_BUCKET: hamyar-e-man
        run: |
          set -uo pipefail
          pip install --quiet boto3 requests
          mkdir -p ci-report
          python3 scripts/diagnose_arvan.py > ci-report/arvan-diagnose.md 2>&1
          code=$?
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path("ci-report/arvan-diagnose.md")
          text = path.read_text(encoding="utf-8", errors="replace")
          for name in ("ARVAN_ACCESS_KEY", "ARVAN_SECRET_KEY"):
              value = os.getenv(name, "").strip()
              if len(value) > 3:
                  text = text.replace(value, f"<{name}>")
          text = re.sub(r"[A-Za-z0-9/+=]{38,}", "<redacted>", text)
          path.write_text(text, encoding="utf-8")
          print(text)
          PY
          exit 0

      - name: ثبت نتیجه روی برنچ
        if: always()
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f ci-report/arvan-diagnose.md
          if ! git diff --cached --quiet; then
            git commit -m "نتیجهٔ تشخیص آروان"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          cat ci-report/arvan-diagnose.md >> "$GITHUB_STEP_SUMMARY"
