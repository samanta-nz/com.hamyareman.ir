name: Compile check (p09 debug)

# فقط کامپایل و تست‌های JVM — بدون APK، بدون باکت، بدون اعلام نسخه.
# راه‌اندازی: کامیتی روی همین برنچ که در پیامش `[compile]` باشد.

on:
  push:
    branches: [arena/01a0fe97-com-hamyareman-ir]

permissions:
  contents: read

concurrency:
  group: arena-compile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    if: contains(github.event.head_commit.message, '[compile]')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
      - run: ./gradlew --console=plain --stacktrace :hamyar-app:compileP09DebugKotlin :core-common:testDebugUnitTest :hamyar-app:testP09DebugUnitTest
