name: Build check and publish music HTML

# سه فایل موسیقی (player / tile / full) را از همین برنچ با کلید زندهٔ محتوا به
# فرمت HMK1 رمز می‌کند، روی پارس‌پک جایگزین نسخهٔ قبلی می‌کند و بعد با دانلود و
# رمزگشایی تأیید می‌کند. پیش از آن، کامپایل اپ بررسی می‌شود.
#
# با «[music-sync]» در پیام کامیت یا دستی اجرا می‌شود.

on:
  push:
    branches: [arena/01a0fe97-com-hamyareman-ir]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: music-html-sync
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[music-sync]')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: کامپایل اپ نهم (debug)
        run: ./gradlew :hamyar-app:compileP09DebugKotlin --stacktrace

  publish:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      APPWRITE_ENDPOINT: https://sgp.cloud.appwrite.io/v1
      APPWRITE_PROJECT_ID: 6abb134a002025222005
      APPWRITE_DATABASE_ID: 6abb238d000d05730d10
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
      HTML_MEDIA_KEY_B64: ${{ secrets.HTML_MEDIA_KEY_B64 }}
      PARSPACK_ACCESS_KEY: ${{ secrets.PARSPACK_ACCESS_KEY }}
      PARSPACK_SECRET_KEY: ${{ secrets.PARSPACK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests cryptography boto3

      - name: آماده‌سازی سه فایل موسیقی از همین برنچ
        run: |
          set -e
          mkdir -p /tmp/music
          cp Bucket/Html-files/background-music.html /tmp/music/
          cp Bucket/Html-files/background-music-tile.html /tmp/music/
          cp Bucket/Html-files/background-music-full.html /tmp/music/
          ls -l /tmp/music
          sha256sum /tmp/music/*.html

      - name: رمزگذاری HMK1 و جایگزینی روی پارس‌پک
        run: |
          set +e
          python3 scripts/upload_encoded_to_parspack.py \
            --source /tmp/music \
            --prefix "Bucket/Html-files" \
            --report ci-report/music-parspack-upload.md
          echo "exit=$?"
          exit 0

      - name: تأیید نهایی (دانلود + رمزگشایی + مقایسهٔ sha256)
        run: |
          set +e
          python3 scripts/verify_music_bucket_files.py \
            --source Bucket/Html-files \
            --prefix "Bucket/Html-files" \
            --report ci-report/music-bucket-verify.md
          echo "verify-exit=$?"
          exit 0

      - name: خلاصه
        if: always()
        run: |
          set +e
          cat ci-report/music-parspack-upload.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat ci-report/music-bucket-verify.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          exit 0

      - name: کامیت گزارش
        if: always()
        run: |
          set +e
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f ci-report/music-parspack-upload.md ci-report/music-bucket-verify.md
          if git diff --cached --quiet; then echo "بدون تغییر"; else
            git commit -m "گزارش انتشار HTMLهای موسیقی ${GITHUB_SHA::7} [skip-report]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          exit 0
