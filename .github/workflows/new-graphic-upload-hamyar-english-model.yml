name: Upload Hamyar English Kokoro model to ParsPack

on:
  workflow_dispatch:
  push:
    branches: [New-graphic]
    paths:
      - '.github/workflows/new-graphic-upload-hamyar-english-model.yml'
      - 'scripts/upload_kokoro_model.py'

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PARSPACK_ACCESS_KEY: ${{ secrets.PARSPACK_ACCESS_KEY }}
      PARSPACK_SECRET_KEY: ${{ secrets.PARSPACK_SECRET_KEY }}
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Checkout upload tooling
        uses: actions/checkout@v4
        with:
          ref: New-graphic

      - name: Checkout Hamyar English model with LFS
        uses: actions/checkout@v4
        with:
          repository: samanta-nz/Hamyar-english
          ref: main
          path: hamyar-english-src
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install S3 tooling
        run: python -m pip install --disable-pip-version-check --quiet boto3 requests

      - name: Upload and verify Kokoro model
        run: |
          set -euo pipefail
          python scripts/upload_kokoro_model.py \
            --file hamyar-english-src/app/src/main/assets/models/kokoro-v1.0.fp16.onnx \
            --key "Hamyar.English/kokoro-v1.0.fp16.onnx"
