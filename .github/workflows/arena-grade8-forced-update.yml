name: Grade 8 forced dual-server update

on:
  push:
    branches: [arena/01a0ea05-com-hamyareman-ir]

permissions:
  contents: write

env:
  APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
  ARVAN_ACCESS_KEY: ${{ secrets.ARVAN_ACCESS_KEY }}
  ARVAN_SECRET_KEY: ${{ secrets.ARVAN_SECRET_KEY }}

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Release grade 8 forced update')
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test and build grade-eight seed v99
        run: |
          set -euo pipefail
          ./gradlew :core-common:testDebugUnitTest :hamyar-app:testP08DebugUnitTest :hamyar-app:assembleP08Debug \
            -PhamyarVersionCode=99 -PhamyarVersionName=1.98 --stacktrace
          mkdir -p dist
          mapfile -t files < <(find apps/hamyar-app/build/outputs/apk/p08/debug -type f -name '*.apk' -print)
          test "${#files[@]}" -eq 1
          cp "${files[0]}" dist/hamyar-grade8-test-seed-v99.apk

      - name: Build forced grade-eight update v100
        run: |
          set -euo pipefail
          ./gradlew :hamyar-app:clean
          ./gradlew :hamyar-app:assembleP08Debug \
            -PhamyarVersionCode=100 -PhamyarVersionName=1.99 --stacktrace
          mapfile -t files < <(find apps/hamyar-app/build/outputs/apk/p08/debug -type f -name '*.apk' -print)
          test "${#files[@]}" -eq 1
          cp "${files[0]}" dist/hamyar-grade8-forced-update-v100.apk

      - name: Verify both APK identities and fixed signer
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          expected=$(tr -d '[:space:]' < config/release-signing-sha256.txt | tr -d ':-' | tr 'A-F' 'a-f')
          for pair in seed:99 update:100; do
            kind=${pair%%:*}; code=${pair##*:}
            if [ "$kind" = seed ]; then apk=dist/hamyar-grade8-test-seed-v99.apk; else apk=dist/hamyar-grade8-forced-update-v100.apk; fi
            badging="$($AAPT dump badging "$apk" | head -1)"
            grep -F "name='com.hamyareman.p08'" <<<"$badging"
            grep -F "versionCode='$code'" <<<"$badging"
            signer="$($APKSIGNER verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ': ' | tr 'A-F' 'a-f')"
            test "$signer" = "$expected"
          done
          echo "SIGNER_SHA256=$expected" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: grade8-forced-update-test
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish test APK pair on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=grade8-forced-update-test-v100
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --target "$GITHUB_SHA" --prerelease \
            --title "آزمایش آپدیت اجباری پایه هشتم — v100" \
            --notes "ابتدا seed-v99 را نصب کنید؛ سپس اپ باید update-v100 را اجباری دریافت کند."
          gh release upload "$tag" dist/*.apk --clobber
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Detect repository storage credentials
        id: credentials
        run: |
          if [ -n "${APPWRITE_API_KEY:-}" ] && [ -n "${ARVAN_ACCESS_KEY:-}" ] && [ -n "${ARVAN_SECRET_KEY:-}" ]; then
            echo available=true >> "$GITHUB_OUTPUT"
          else
            echo available=false >> "$GITHUB_OUTPUT"
          fi

      - name: Publish one-time grade-eight sealing key
        if: steps.credentials.outputs.available != 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/hamyar-grade8 maintenance-handshake
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 \
            -out /tmp/hamyar-grade8/private.pem 2>/dev/null
          openssl pkey -in /tmp/hamyar-grade8/private.pem -pubout \
            -out "maintenance-handshake/public-${GITHUB_RUN_ID}.pem" 2>/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maintenance-handshake
          git commit -m "Publish one-time grade-eight update sealing key"
          git push origin HEAD:arena/01a0ea05-com-hamyareman-ir

      - name: Open one-time sealed storage credentials
        if: steps.credentials.outputs.available != 'true'
        run: |
          set -euo pipefail
          python3 -m pip install --quiet cryptography
          bundle=/tmp/hamyar-grade8/credentials.sealed.json
          bundle_path="maintenance-handshake/credentials-${GITHUB_RUN_ID}.sealed.json"
          remote_ref=refs/remotes/origin/arena/01a0ea05-com-hamyareman-ir
          for _ in $(seq 1 180); do
            git fetch --quiet origin refs/heads/arena/01a0ea05-com-hamyareman-ir:"$remote_ref"
            if git cat-file -e "$remote_ref:$bundle_path" 2>/dev/null; then
              git show "$remote_ref:$bundle_path" > "$bundle"
              break
            fi
            sleep 5
          done
          test -s "$bundle"
          python3 - <<'PY'
          import base64,json,os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes,serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          env=json.loads(Path('/tmp/hamyar-grade8/credentials.sealed.json').read_text())
          private=serialization.load_pem_private_key(Path('/tmp/hamyar-grade8/private.pem').read_bytes(),password=None)
          key=private.decrypt(base64.b64decode(env['sealedKey']),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          plain=AESGCM(key).decrypt(base64.b64decode(env['nonce']),base64.b64decode(env['ciphertext']),b'hamyar-grade8-update-v1')
          values=json.loads(plain)
          with open(os.environ['GITHUB_ENV'],'a') as out:
              for name in ('APPWRITE_API_KEY','ARVAN_ACCESS_KEY','ARVAN_SECRET_KEY'):
                  out.write(f"{name}={str(values[name]).replace(chr(10),'')}\n")
          PY

      - name: Upload v100 to Appwrite and Arvan, then force grade eight
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests boto3 appwrite
          mkdir -p grade8-output
          python3 scripts/publish_grade8_update.py \
            dist/hamyar-grade8-forced-update-v100.apk \
            --version-code 100 --version-name 1.99 \
            --signer-sha256 "$SIGNER_SHA256" | tee grade8-output/result.json

      - name: Destroy one-time credentials
        if: always()
        run: |
          shred -u /tmp/hamyar-grade8/private.pem /tmp/hamyar-grade8/credentials.sealed.json 2>/dev/null || true
          rm -rf /tmp/hamyar-grade8

      - name: Store sanitized result and remove handshake
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin arena/01a0ea05-com-hamyareman-ir
          rm -rf maintenance-handshake
          mkdir -p docs/maintenance/grade8
          cp -f grade8-output/result.json docs/maintenance/grade8/latest.json 2>/dev/null || true
          git add -A docs/maintenance/grade8
          if git ls-files maintenance-handshake | grep -q .; then git add -A maintenance-handshake; fi
          if ! git diff --cached --quiet; then
            git commit -m "Store grade-eight forced update result"
            git push origin HEAD:arena/01a0ea05-com-hamyareman-ir
          fi
