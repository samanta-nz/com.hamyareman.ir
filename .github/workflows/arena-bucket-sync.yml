name: Sync bucket menus and inventory

# فهرست کامل باکت پارس + آوردن menu.txt/menu.json به‌روز + شناسایی پوشه‌های exam.
# با «[bucket-sync]» در پیام کامیت یا دستی.

on:
  push:
    branches: [arena/01a0efde-com-hamyareman-ir]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bucket-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[bucket-sync]')
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PARSPACK_ACCESS_KEY: ${{ secrets.PARSPACK_ACCESS_KEY }}
      PARSPACK_SECRET_KEY: ${{ secrets.PARSPACK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet boto3
      - name: فهرست‌برداری و دریافت منوها
        run: |
          set +e
          python3 scripts/sync_bucket_menus.py --prefix "Bucket/" --out bucket-sync
          echo "exit=$?"
          exit 0
      - name: خلاصه
        if: always()
        run: |
          set +e
          head -n 80 ci-report/bucket-inventory.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "گزارشی نیست." >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: کامیت نتیجه
        if: always()
        run: |
          set +e
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f bucket-sync ci-report/bucket-inventory.md ci-report/bucket-inventory.json
          if git diff --cached --quiet; then echo "بدون تغییر"; else
            git commit -m "همگام‌سازی منوها و فهرست باکت ${GITHUB_SHA::7} [skip-report]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          exit 0
