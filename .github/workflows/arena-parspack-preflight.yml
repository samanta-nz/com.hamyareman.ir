name: Preflight internal storage (ParsPack)

# آمادگی‌سنجی سرور داخلی تازه پیش از مهاجرت کامل از آروان.
# بدون بیلد؛ فقط چند فراخوان S3. خروجی در ci-report/parspack-preflight.md
# روی همین برنچ کامیت می‌شود (لاگ Actions از محیط توسعه قابل دانلود نیست).
#
# راه‌اندازی: کامیتی که پیامش با «Preflight ParsPack» شروع شود.

on:
  push:
    branches: [arena/01a0efde-com-hamyareman-ir]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arena-parspack-preflight
  cancel-in-progress: true

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Preflight ParsPack')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: اجرای آمادگی‌سنجی
        env:
          PARSPACK_ACCESS_KEY: ${{ secrets.PARSPACK_ACCESS_KEY }}
          PARSPACK_SECRET_KEY: ${{ secrets.PARSPACK_SECRET_KEY }}
        run: |
          set -uo pipefail
          pip install --quiet boto3 requests
          mkdir -p ci-report
          if [ -z "${PARSPACK_ACCESS_KEY:-}" ] || [ -z "${PARSPACK_SECRET_KEY:-}" ]; then
            {
              echo "# آمادگی‌سنجی سرور داخلی"
              echo
              echo "❌ **کلیدها هنوز در Secrets مخزن نیستند.**"
              echo
              echo "در Settings → Secrets and variables → Actions این دو را اضافه کنید:"
              echo
              echo '- `PARSPACK_ACCESS_KEY`'
              echo '- `PARSPACK_SECRET_KEY`'
            } > ci-report/parspack-preflight.md
          else
            python3 scripts/preflight_parspack.py > ci-report/parspack-preflight.md 2>&1 || true
            python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path("ci-report/parspack-preflight.md")
          text = path.read_text(encoding="utf-8", errors="replace")
          for name in ("PARSPACK_ACCESS_KEY", "PARSPACK_SECRET_KEY"):
              value = os.getenv(name, "").strip()
              if len(value) > 3:
                  text = text.replace(value, f"<{name}>")
          text = re.sub(r"[A-Za-z0-9/+=]{38,}", "<redacted>", text)
          path.write_text(text, encoding="utf-8")
          PY
          fi
          cat ci-report/parspack-preflight.md

      - name: ثبت نتیجه روی برنچ
        if: always()
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f ci-report/parspack-preflight.md
          if ! git diff --cached --quiet; then
            git commit -m "نتیجهٔ آمادگی‌سنجی پارس‌پک"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          cat ci-report/parspack-preflight.md >> "$GITHUB_STEP_SUMMARY"
