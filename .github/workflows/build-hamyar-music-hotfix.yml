name: Build Hamyar music/WebView hotfix

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Exact source ref/commit to build'
        required: true
        default: '19ad0d7f3c9c482616ce3beee512859997028bc5'
      version_code:
        description: 'Hotfix version code'
        required: true
        default: '2441'
      version_name:
        description: 'Hotfix version name'
        required: true
        default: '2.4.4-hotfix'

permissions:
  contents: read

env:
  PACKAGE: com.hamyareman.p09

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Apply source hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("apps/hamyar-app/src/main/java/com/hamyareman/ir/ui/study/MusicFrameOverlayBridge.kt")
          p.write_text(r'''package com.hamyareman.ir.ui.study

          import android.webkit.JavascriptInterface
          import android.webkit.WebView

          private const val OVERLAY_BRIDGE = "HamyarMusicOverlay"

          internal fun WebView.installMusicFrameOverlayBridge() {
              evaluateJavascript(
                  """
                  (function(){
                    if(window.__hamyarMusicInflowBridge)return;
                    window.__hamyarMusicInflowBridge=true;
                    var CHANNEL='hamyareman-background-v1';
                    var ATTR='data-hamyar-music-open';
                    var OPEN_HEIGHT='min(620px,78vh)';
                    var CLOSED_HEIGHT='88px';
                    function musicFrame(source){
                      var frames=document.querySelectorAll('iframe'),i,f,src;
                      for(i=0;i<frames.length;i++){f=frames[i];if(f.contentWindow===source){if(f.hasAttribute('data-hamyar-ignore-inflow-bridge'))return null;return f;}}
                      for(i=0;i<frames.length;i++){f=frames[i];if(f.hasAttribute('data-hamyar-ignore-inflow-bridge'))continue;src=(f.getAttribute('src')||'').toLowerCase();if(src.indexOf('background-music')>=0)return f;}
                      return null;
                    }
                    function setOpen(frame,open){
                      if(!frame)return;
                      var h=open?OPEN_HEIGHT:CLOSED_HEIGHT;
                      frame.style.setProperty('display','block','important');
                      frame.style.setProperty('position','relative','important');
                      frame.style.setProperty('inset','auto','important');
                      frame.style.setProperty('top','auto','important');
                      frame.style.setProperty('right','auto','important');
                      frame.style.setProperty('bottom','auto','important');
                      frame.style.setProperty('left','auto','important');
                      frame.style.setProperty('width','100%','important');
                      frame.style.setProperty('min-width','0','important');
                      frame.style.setProperty('max-width','100%','important');
                      frame.style.setProperty('height',h,'important');
                      frame.style.setProperty('min-height',h,'important');
                      frame.style.setProperty('max-height',h,'important');
                      frame.style.setProperty('margin','0','important');
                      frame.style.setProperty('padding','0','important');
                      frame.style.setProperty('border','0','important');
                      frame.style.setProperty('z-index','auto','important');
                      frame.setAttribute(ATTR,open?'true':'false');
                      try{window.HamyarMusicOverlay.onChanged(!!open)}catch(_){ }
                    }
                    window.addEventListener('message',function(event){
                      var data=event.data;
                      if(!data || data.channel!==CHANNEL || typeof data.opened!=='boolean')return;
                      var frame=musicFrame(event.source);if(!frame)return;
                      try{event.stopImmediatePropagation();}catch(_){ }
                      setOpen(frame,data.opened);
                    },true);
                    window.__hamyarCloseMusicOverlay=function(){
                      var list=document.querySelectorAll('iframe['+ATTR+'="true"]'),i,f;
                      for(i=0;i<list.length;i++){f=list[i];try{f.contentWindow.postMessage({channel:CHANNEL,type:'close'},'*')}catch(_){ }setOpen(f,false);}
                    };
                  })();
                  """.trimIndent(),
                  null,
              )
          }

          internal fun WebView.installMusicOverlayHost(onChanged: (Boolean) -> Unit) {
              addJavascriptInterface(MusicOverlayHost(this, onChanged), OVERLAY_BRIDGE)
          }

          internal fun WebView.closeMusicFrameOverlay() {
              evaluateJavascript(
                  "try{window.__hamyarCloseMusicOverlay&&window.__hamyarCloseMusicOverlay();}catch(e){}",
                  null,
              )
          }

          private class MusicOverlayHost(
              private val web: WebView,
              private val callback: (Boolean) -> Unit,
          ) {
              @JavascriptInterface
              fun onChanged(open: Boolean) { web.post { callback(open) } }
          }
          '''.replace("          ", ""), encoding="utf-8")

          t = Path("apps/hamyar-app/src/main/java/com/hamyareman/ir/ui/calmdown/BackgroundMusicTileHost.kt")
          s = t.read_text(encoding="utf-8")
          s = s.replace("import androidx.compose.animation.core.animateDpAsState\n", "")
          s = s.replace("import androidx.compose.animation.core.tween\n", "")
          s = s.replace(
              '''            // باز که می‌شود، میزبان تا ته صفحه بالا می‌آید تا آکاردئون بریده نشود.\n            val target = if (expanded) (screenHeight - 24.dp).coerceAtLeast(420.dp) else TILE_HEIGHT\n            val height by animateDpAsState(target, tween(340), label = "music tile height")\n            Box(modifier.fillMaxWidth().height(height)) {\n''',
              '''            // فقط یک اندازهٔ نهایی؛ بدون انیمیشنِ چندچرخه‌ای روی Android WebView.\n            val height = if (expanded) (screenHeight - 24.dp).coerceAtLeast(420.dp) else TILE_HEIGHT\n            Box(modifier.fillMaxWidth().height(height)) {\n''')
          old = '''                            // تنها صفحات موسیقی/خواب نگهبان Web Audio دارند تا با قفل صفحه قطع نشوند.\n                            view.bindManagedMediaLifecycle(watchWebAudio = true)\n                            // پشتیبان: اگر رابط HamyarHost به هر دلیل صدا نخورد،\n'''
          new = '''                            // تنها صفحات موسیقی/خواب نگهبان Web Audio دارند تا با قفل صفحه قطع نشوند.\n                            view.bindManagedMediaLifecycle(watchWebAudio = true)\n                            // background-music-tile.html خودش iframe داخلی را fixed می‌کند.\n                            // در Android WebView آن لایهٔ fixed را به flow محلی تبدیل می‌کنیم.\n                            view.evaluateJavascript(\n                                """\n                                (function(){\n                                  if(window.__hamyarSleepTileSafe)return;\n                                  window.__hamyarSleepTileSafe=true;\n                                  var s=document.createElement('style');\n                                  s.setAttribute('data-hamyar-sleep-tile-safe','');\n                                  s.textContent=\n                                    'body.is-open{overflow:visible!important}' +\n                                    'body.is-open #scrim{position:absolute!important;inset:0!important;z-index:2147483646!important}' +\n                                    'body.is-open #backgroundMusicFrame{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;max-height:none!important;z-index:2147483647!important}';\n                                  (document.head||document.documentElement).appendChild(s);\n                                })();\n                                """.trimIndent(),\n                                null,\n                            )\n                            // پشتیبان: اگر رابط HamyarHost به هر دلیل صدا نخورد،\n'''
          if old not in s: raise SystemExit('tile anchor not found')
          s = s.replace(old, new, 1)
          t.write_text(s, encoding="utf-8")
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never

      - name: Unit tests + assemble
        run: |
          set -euo pipefail
          ./gradlew --console=plain --stacktrace \
            :core-common:testDebugUnitTest \
            :hamyar-app:testP09DebugUnitTest \
            :hamyar-app:assembleP09Debug \
            -PhamyarVersionCode="${{ inputs.version_code }}" \
            -PhamyarVersionName="${{ inputs.version_name }}"

      - name: Validate APK
        run: |
          set -euo pipefail
          mapfile -t files < <(find apps/hamyar-app/build/outputs/apk/p09/debug -type f -name '*.apk' -print)
          test "${#files[@]}" -eq 1
          APK="${files[0]}"
          BADGING="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" | head -1)"
          echo "$BADGING"
          grep -F "name='${PACKAGE}'" <<<"$BADGING"
          mkdir -p dist
          OUT="dist/hamyar-grade9-${{ inputs.version_name }}-debug.apk"
          cp -f "$APK" "$OUT"
          echo "APK_SHA256=$(sha256sum "$OUT" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          sha256sum "$OUT"
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: hamyar-grade9-2.4.4-hotfix
          path: dist/hamyar-grade9-${{ inputs.version_name }}-debug.apk
          if-no-files-found: error
          retention-days: 14
