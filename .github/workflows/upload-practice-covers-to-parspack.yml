name: Upload CSV-mapped tile covers to ParsPack

on:
  push:
    branches: [New-graphic]
    paths:
      - ".github/workflows/upload-practice-covers-to-parspack.yml"
      - "scripts/upload_practice_covers_to_parspack.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parspack-csv-tile-covers
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PARSPACK_ACCESS_KEY: ${{ secrets.PARSPACK_ACCESS_KEY }}
      PARSPACK_SECRET_KEY: ${{ secrets.PARSPACK_SECRET_KEY }}
    steps:
      - name: Checkout uploader
        uses: actions/checkout@v4
        with:
          ref: New-graphic

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install S3 upload dependencies
        run: python -m pip install --disable-pip-version-check --quiet boto3 requests

      - name: Fetch exact assets from Books-Data
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/samanta-nz/Books-Data.git /tmp/books-data
          SOURCE="/tmp/books-data/Bucket/Html-files/assets/practice-covers"
          test -d "$SOURCE"
          COUNT="$(find "$SOURCE" -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) | wc -l)"
          test "$COUNT" -eq 189
          echo "Books-Data main: $(git -C /tmp/books-data rev-parse HEAD)" | tee /tmp/books-data-revision.txt
          echo "CSV expected: 189 images; found: $COUNT"

      - name: Upload all 189 CSV keys and verify public bytes
        run: |
          set -euo pipefail
          python scripts/upload_practice_covers_to_parspack.py \
            --source /tmp/books-data/Bucket/Html-files/assets/practice-covers \
            --report ci-report/practice-covers-upload.md

      - name: Publish verification summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ParsPack tile-cover upload"
            cat /tmp/books-data-revision.txt 2>/dev/null || true
            cat ci-report/practice-covers-upload.md 2>/dev/null || echo "No upload report was generated."
          } >> "$GITHUB_STEP_SUMMARY"
