name: Appwrite runtime audit

on:
  push:
    branches: [main, New-graphic]
    paths:
      - 'scripts/audit_appwrite_runtime.py'
      - 'shared/core-appwrite/**'
      - 'shared/core-sync/**'
      - 'apps/hamyar-app/src/main/java/com/hamyareman/ir/ui/profile/**'
      - 'apps/hamyar-app/src/main/java/com/hamyareman/ir/ui/safespace/**'
      - 'apps/hamyar-app/src/main/java/com/hamyareman/ir/ui/study/**'
      - 'apps/hamyar-app/src/main/java/com/hamyareman/ir/ui/settings/**'
      - '.github/workflows/appwrite-runtime-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      APPWRITE_ENDPOINT: https://sgp.cloud.appwrite.io/v1
      APPWRITE_PROJECT_ID: 6abb134a002025222005
      APPWRITE_DATABASE_ID: 6abb238d000d05730d10
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Appwrite schema and storage
        run: |
          python3 scripts/audit_appwrite_runtime.py | tee appwrite-runtime-audit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appwrite-runtime-audit
          path: appwrite-runtime-audit.txt
          retention-days: 7
