<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>در دست تولید — همیار من</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --bg:#0b0b12; --ink:#eef0f8; --dim:#9aa0bb;
    --a:#7c5cff; --b:#19c8c0; --c:#ff5c93;
  }
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Naskh Arabic",Tahoma,sans-serif;
    display:grid; place-items:center; overflow:hidden; position:relative;
  }

  /* هاله‌های رنگی که آرام نفس می‌کشند */
  .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;will-change:transform}
  .o1{width:46vmin;height:46vmin;background:var(--a);top:-10vmin;inset-inline-start:-8vmin;animation:drift1 14s ease-in-out infinite}
  .o2{width:38vmin;height:38vmin;background:var(--b);bottom:-10vmin;inset-inline-end:-6vmin;animation:drift2 17s ease-in-out infinite}
  .o3{width:30vmin;height:30vmin;background:var(--c);top:44%;inset-inline-start:58%;animation:drift3 21s ease-in-out infinite}
  @keyframes drift1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6vmin,8vmin,0) scale(1.14)}}
  @keyframes drift2{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-7vmin,-6vmin,0) scale(1.1)}}
  @keyframes drift3{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-5vmin,7vmin,0) scale(.88)}}

  .card{
    position:relative; z-index:2; width:min(86vw,440px);
    padding:38px 26px 30px; text-align:center; border-radius:26px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(18px) saturate(1.3);
    -webkit-backdrop-filter:blur(18px) saturate(1.3);
    box-shadow:0 24px 70px rgba(0,0,0,.5);
    animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}

  /* چرخ‌دنده‌های در حال ساخت */
  .gears{width:92px;height:92px;margin:0 auto 20px;position:relative}
  .gear{position:absolute;inset:0;margin:auto;transform-origin:50% 50%}
  .g1{width:62px;height:62px;top:0;inset-inline-start:0;animation:spin 7s linear infinite}
  .g2{width:42px;height:42px;bottom:0;inset-inline-end:0;animation:spin 5s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  .gear svg{width:100%;height:100%;display:block}

  h1{margin:0 0 10px;font-size:clamp(20px,5.4vw,26px);font-weight:800;letter-spacing:.2px}
  /* نوار نورِ روان روی متن */
  .shine{
    background:linear-gradient(100deg,var(--ink) 20%,#fff 38%,var(--a) 50%,#fff 62%,var(--ink) 80%);
    background-size:260% 100%;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    animation:sweep 3.4s ease-in-out infinite;
  }
  @keyframes sweep{0%{background-position:160% 0}100%{background-position:-60% 0}}

  p{margin:0;color:var(--dim);font-size:clamp(13px,3.7vw,15px);line-height:2.1}

  .bar{
    margin:24px auto 6px;height:7px;width:78%;border-radius:99px;
    background:rgba(255,255,255,.1);overflow:hidden;position:relative;
  }
  .bar i{
    position:absolute;inset-block:0;inline-size:42%;border-radius:99px;
    background:linear-gradient(90deg,var(--a),var(--b),var(--c));
    animation:slide 2.1s cubic-bezier(.65,0,.35,1) infinite;
  }
  @keyframes slide{0%{inset-inline-start:-45%}100%{inset-inline-start:100%}}

  .dots{margin-top:14px;display:flex;gap:7px;justify-content:center}
  .dots span{width:7px;height:7px;border-radius:50%;background:var(--a);opacity:.35;animation:blink 1.4s ease-in-out infinite}
  .dots span:nth-child(2){animation-delay:.2s;background:var(--b)}
  .dots span:nth-child(3){animation-delay:.4s;background:var(--c)}
  @keyframes blink{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

  <main class="card">
    <div class="gears" aria-hidden="true">
      <div class="gear g1">
        <svg viewBox="0 0 100 100" fill="none" stroke="#7c5cff" stroke-width="7" stroke-linejoin="round">
          <path d="M50 12l7 9 11-3 3 11 11 4-5 10 7 9-9 7 1 11-11 2-5 10-10-4-10 5-5-11-11-2 1-11-9-7 7-9-5-10 11-4 3-11 11 3z"/>
          <circle cx="50" cy="50" r="13"/>
        </svg>
      </div>
      <div class="gear g2">
        <svg viewBox="0 0 100 100" fill="none" stroke="#19c8c0" stroke-width="8" stroke-linejoin="round">
          <path d="M50 14l9 11 14-2 2 14 12 6-7 12 6 12-13 5-4 13-13-4-12 7-8-11-14-1 1-14-10-9 10-10-1-13 14-2z"/>
          <circle cx="50" cy="50" r="12"/>
        </svg>
      </div>
    </div>

    <h1 class="shine">در دست تولید</h1>
    <p>این بخش هنوز آماده نشده است.<br>به‌زودی در دسترس قرار می‌گیرد.</p>

    <div class="bar"><i></i></div>
    <div class="dots"><span></span><span></span><span></span></div>
  </main>
</body>
</html>
